# Scale CSI Driver Helm Chart Values

# CSI Driver name (should match the driver name in StorageClass)
csiDriverName: csi.scale.io

# CSIStorageCapacity tracking. Strictly opt-in (default off) so the default
# render stays byte-identical and no cluster-scoped csistoragecapacities
# objects or extra RBAC are created unless an operator asks for them.
#
# SCHEDULER PREREQUISITE (codex M2): external-provisioner v6.3.0 publishes
# CSIStorageCapacity objects ONLY for StorageClasses whose volumeBindingMode is
# WaitForFirstConsumer; it ignores Immediate classes by default, and the
# Kubernetes scheduler likewise only consults capacity for WaitForFirstConsumer
# binding. The bundled `scale-nfs` class is Immediate, so enabling capacity
# against otherwise-default values starts the capacity controller but creates NO
# capacity objects and cannot influence scheduling. To make capacity affect
# scheduling you must ALSO use a WaitForFirstConsumer StorageClass. If you only
# need capacity published for non-scheduler consumers against Immediate classes,
# opt in to forImmediateBinding below.
#
# STEADY-STATE API COST when enabled: the external-provisioner issues a periodic
# GetCapacity per referencing StorageClass on its resync interval. After the
# E2/K7 fix each GetCapacity is exactly ONE pool.dataset.query against the parent
# dataset (all StorageClasses of this single-backend driver report the same pool
# number). This is background provisioner load, NOT part of the
# CreateVolume/publish/unpublish request-path golden totals.
capacity:
  # Advertise CSIDriver.spec.storageCapacity=true and add the provisioner's
  # --enable-capacity flag plus its csistoragecapacities RBAC. Default off.
  enabled: false
  # Opt-in: also publish CSIStorageCapacity for Immediate-binding StorageClasses
  # (renders the provisioner's --capacity-for-immediate-binding). Default off
  # because the scheduler ignores capacity for immediate binding; this is only
  # useful for non-scheduler capacity consumers. Has no effect unless
  # capacity.enabled is true.
  forImmediateBinding: false
  # E2: set GetCapacityResponse.maximum_volume_size. Intended ONLY for thick
  # deployments (zfs.zvolEnableReservation=true); under the default thin/sparse
  # provisioning a hard maximum makes the scheduler wrongly reject legitimate
  # overcommit. TrueNAS 26.0 exposes no dedicated max-size API, so the ceiling
  # is the parent dataset's available bytes. Default off.
  reportMaximumVolumeSize: false
  # E4: run a controller-only poll loop publishing scale_csi_pool_available_bytes
  # and scale_csi_pool_capacity_bytes. STEADY-STATE API COST when enabled: +1
  # pool.dataset.query per gaugeInterval PER CONTROLLER REPLICA. The gauge loop
  # has no leader-election gate (consistent with the orphan reconcile), so with
  # controller.replicas>1 the documented +1 query/interval is incurred by EACH
  # replica; the supported/documented configuration is replicas=1 (singleton),
  # where it is 1/min. Zero impact on the CreateVolume/publish/unpublish
  # request-path golden totals. Default off (zero new calls).
  gaugeEnabled: false
  # Poll cadence for the capacity gauge loop. Values below 30s are clamped to it.
  gaugeInterval: 60s

# Backend health -> per-PVC VolumeCondition + scale_csi_pool_* gauges.
#
# ZFS exposes NO per-dataset health signal: health is a per-POOL fact (plus
# per-disk temperature). Every volume this driver manages lives on ONE pool, so
# a pool condition is legitimately attributable to all of them and is fanned out
# onto every managed PVC's CSI VolumeCondition, which the external health
# monitor turns into PVC events.
#
# Severity is deliberately conservative: DEGRADED/FAULTED/UNAVAIL marks volumes
# Abnormal, while a routine scrub/resilver or a disk temperature alert only adds
# a descriptive message — a monthly scrub must never mark every PVC unhealthy.
#
# STEADY-STATE API COST when enabled: at most TWO reads (pool.query +
# disk.temperature_alerts) per interval PER CONTROLLER REPLICA, and zero writes.
# Like the capacity gauge loop it has no leader-election gate; the supported
# configuration is controller.replicas=1; Helm rejects a larger replica count.
# maxSurge 0 only covers rollout surge — Deployment termination, drain and
# eviction overlap remain an inherent residual detected by the skew alert, not
# prevented by this chart. No effect on the CreateVolume /
# publish / unpublish request-path golden totals.
#
# The fan-out is damped so a flapping or unreachable backend cannot churn every
# PVC. Metrics always carry the RAW sample; only the VolumeCondition is damped:
#   * hysteresis — a health transition must be confirmed by TWO consecutive
#     samples before it flips every managed PVC's condition;
#   * staleness TTL — after three missed intervals the cached snapshot stops
#     driving CONDITIONS at all (they fall back to the pre-GF5 dataset-only
#     semantics) and scale_csi_pool_health_stale goes to 1. This bounds how long
#     a stale verdict can drive PVC conditions; it does NOT silence alerting.
#     The raw gauges stay FROZEN at their last sample, so a frozen DEGRADED keeps
#     ScaleCSIPoolDegraded firing until a successful sample changes it — that
#     alert is deliberately not gated on scale_csi_pool_health_stale.
#
# BECAUSE the condition is damped, the gauges are not, the alerts add their own
# `for` hold on top of the gauges AND Prometheus observes all of it on its own
# scrape/evaluation cadence, these views DO differ transiently — they share one
# severity split, not one timeline. There are SEVEN NUMBERED classes of divergence;
# the first three have an upper bound, the last four do not (canonical list:
# backendHealthFlipSamples in pkg/driver/backend_health.go):
#   1. confirmation lag — BOUNDED: a confirmed transition reaches the DRIVER's own
#      published condition up to one poll interval plus one 30s call timeout
#      after the gauges (<= 2m30s at the ceiling), which stays inside the 5m
#      ScaleCSIPoolDegraded hold. That bounds DRIVER-SIDE PUBLICATION only —
#      the PVC object and the alert are downstream of it and outside this
#      number entirely. flip_pending = 1;
#   2. alert hold — BOUNDED by the rule's own 5m `for`: once the condition
#      confirms, PVCs read Abnormal while ScaleCSIPoolDegraded is still PENDING.
#      The ceiling CREATES this ordering rather than removing it, and BOTH
#      diagnostic gauges read 0 here — use the alert's pending state, not them;
#   3. recovery — BOUNDED, one sample: the raw degraded gauge clears one sample
#      BEFORE the condition, by design. flip_pending = 1;
#   4. poll stall — UNBOUNDED: it lasts until a SUCCESSFUL USABLE sample arrives.
#      A reply is not a usable sample: a valid pool.query that does not list the
#      pool returns `pool ... not found` and is still a failed sample.
#      The condition holds its last value while flip_pending and/or
#      scale_csi_pool_health_stale go to 1 (alerts
#      ScaleCSIPoolConditionFlipPending / ScaleCSIPoolHealthStale). Past the TTL
#      conditions fall back to dataset-only while flip_pending may still read 1;
#   5. observer lag — UNBOUNDED and invisible to the driver: Prometheus sees the
#      gauges only on its next scrape and starts `for` at the first true
#      EVALUATION, so after a recovery both diagnostic gauges can read 0 while
#      the alert still fires. This chart puts no upper limit on the
#      ServiceMonitor interval. Compare
#      scale_csi_pool_health_last_success_timestamp_seconds (driver-owned) with
#      scrape freshness — never timestamp(), which returns the SCRAPE time;
#   6. cold start — UNBOUNDED until the first successful sample of a process: the
#      raw scale_csi_pool_* series do not exist yet, so ScaleCSIPoolDegraded
#      cannot fire at all; the driver publishes scale_csi_pool_health_stale = 1
#      (flip_pending = 0) so the window is visible. The pool label is the
#      CONFIGURED name, so a missing or renamed pool looks exactly like an
#      unreachable one;
#   7. replica skew — UNBOUNDED, and a PRODUCER-IDENTITY difference rather than a
#      timing one: every replica polls (no leader election) and a fencing-off
#      RollingUpdate can overlap processes, so `max by (pool)` merges
#      independently sampled histories. Supported single-producer setup is
#      controller.replicas=1, which is why enabling backendHealth renders a
#      non-overlapping rollout. Detect it with
#      count by (pool) (scale_csi_pool_health_last_success_timestamp_seconds) > 1
#      (alert ScaleCSIPoolHealthProducerSkew). Termination, drain and eviction
#      overlap remain residuals detected rather than prevented by that alert.
# The temperature count is accompanied by scale_csi_pool_disk_temp_alerts_age_seconds;
# an absent age means the follow-up has not successfully returned yet.
# Read scale_csi_pool_health_flip_pending and scale_csi_pool_health_stale before
# treating a PVC condition as wrong, but remember they do not cover the alert
# hold, observer lag, cold start or replica skew. Full contract:
# docs/production.md, "Backend health".
#
# Default OFF so an upgrade changes neither the rendered manifest nor the
# VolumeCondition semantics of existing volumes.
backendHealth:
  enabled: false
  # Poll cadence, clamped to 30s-2m. The 2m CEILING is not arbitrary: the
  # two-sample hysteresis makes a CONFIRMED condition flip take up to
  # 2 x interval PLUS one 30s backend call timeout (4m30s at the ceiling),
  # which has to stay inside the 5m ScaleCSIPoolDegraded hold — WHILE
  # SUCCESSFUL SAMPLES KEEP ARRIVING; it is a cadence bound, not a wall-clock
  # guarantee, and it cannot cover a sample that never arrives. An
  # out-of-range value is clamped (one warning at controller startup), never
  # rejected. The staleness TTL is three times the EFFECTIVE (clamped) value: 3m
  # at this default, never more than 6m.
  interval: 60s

# ZFS-native encryption at rest (GF-Sprint 1). Strictly opt-in: with
# enabled=false (default) every volume is provisioned plaintext and nothing
# encryption-related renders into the ConfigMap, so behavior is identical to a
# pre-encryption deployment. Credentials are NEVER set here; the passphrase is
# supplied per-StorageClass via the CSI secret refs (see encryptionSecretName on
# a storageClasses[] entry and docs/reference/storageclass.md).
#
# AVAILABILITY HAZARD: a locked dataset serves ZERO I/O. Because TrueNAS does not
# persist a passphrase key (the key is not in the TrueNAS database), a nas01
# reboot leaves every encrypted volume LOCKED until the controller's unlock
# reconciler re-unlocks it best-effort; pods on those volumes see I/O errors
# during the window. Lost Secret = permanent data loss (no TrueNAS-side escrow).
# Read docs/reference/storageclass.md › "Encryption at rest" before enabling.
encryption:
  # Opt the controller into encryption-at-rest management (create-time folding,
  # publish-time unlock, the locked-volume reconciler, and the locked
  # VolumeCondition signal). Default off.
  enabled: false

# Stable ownership identity stamped on newly-created datasets/zvols. Empty
# derives "<csiDriverName>@<zfs.parentDataset>". Never change this for an
# existing installation unless the matching datasets are deliberately adopted.
driverInstanceId: ""

# fencing.mode selects BACKEND publication enforcement only. CSI publication
# tracking (the durable per-volume publication records that enforce single-node
# exclusivity, same-node idempotency, stale-record takeover, and empty-node-id
# unpublish) is ALWAYS on in every mode, so the default is spec-conformant.
#   off      - records only; the transport allowlists are left untouched
#              (pre-v1.2.23 static-allowlist behavior, plus publication tracking).
#   additive - records + per-node identities added to the allowlists without
#              removing configured static identities (rolling-upgrade migration).
#   strict   - records are the sole allowlist.
# For upgrades, roll the node image first, wait for every CSINode to re-register,
# then select "additive". Select "strict" only after the deferred-fencing metric
# remains zero.
fencing:
  mode: "off"
  # Timeout for one background startup convergence attempt. Failures retry.
  startupReconcileTimeout: 10m
  # Continuous VolumeAttachment absence required before a stale publication
  # record left by a force-removed VA finalizer can be revoked.
  staleRecordGracePeriod: 10m

# Image configuration
image:
  repository: ghcr.io/gizmotickler/scale-csi
  tag: ""  # Defaults to v<Chart.appVersion> (matches the v-prefixed published image)
  # Optional immutable manifest digest. When set, digest takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Controller configuration (runs as Deployment)
controller:
  enabled: true
  # Additive/strict fencing requires exactly one non-overlapping controller
  # writer; the chart uses Recreate rollouts in those modes.
  replicas: 1

  # Priority class for controller pods
  priorityClassName: system-cluster-critical

  # Render a PodDisruptionBudget only when replicas is greater than 1.
  podDisruptionBudget:
    enabled: true
    # Set maxUnavailable to "" when using minAvailable.
    minAvailable: ""
    maxUnavailable: 1

  # Security context for the controller driver container
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Resource requests/limits for the controller driver container
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi

  # Node selector for controller pod
  nodeSelector: {}

  # Tolerations for controller pod
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  # Affinity rules. When empty and replicas > 1, the chart supplies preferred
  # hostname anti-affinity; any explicit map replaces that default.
  affinity: {}

  # Additional environment variables
  extraEnv: []

  # Additional volume mounts
  extraVolumeMounts: []

  # Additional volumes
  extraVolumes: []

# Node configuration (runs as DaemonSet)
node:
  enabled: true

  # Priority class for node pods
  priorityClassName: system-node-critical

  # Delay in milliseconds before retrying after stale session cleanup
  sessionCleanupDelay: 500

  # Maximum volumes Kubernetes may schedule to one node. Zero means unlimited
  # and preserves the CSI field's unset behavior.
  maxVolumesPerNode: 0

  # Resource requests/limits for the node driver container
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi

  # Node selector for node pods
  nodeSelector: {}

  # Tolerations for node pods (allow scheduling on all nodes)
  tolerations:
    - operator: Exists

  # Affinity rules
  affinity: {}

  # Additional environment variables
  extraEnv: []

  # Additional volume mounts
  extraVolumeMounts: []

  # Additional volumes
  extraVolumes: []

# Host kubelet directory used for CSI sockets and registration
kubeletDir: /var/lib/kubelet

# TrueNAS connection configuration
truenas:
  # TrueNAS host (required — the driver refuses to start without it)
  host: ""

  # API port (80 for HTTP, 443 for HTTPS)
  port: 443

  # Use HTTPS
  secure: true

  # Skip TLS verification (not recommended for production)
  skipTLSVerify: false

  # Optional PEM-encoded CA certificate for verifying the TrueNAS API.
  # When set, this explicit trust bundle is used instead of system roots.
  caCert: ""

  # Optional path to a mounted PEM-encoded CA certificate file.
  caCertFile: ""

  # API key authentication (recommended; required unless existingSecret is set —
  # the driver refuses to start without one)
  apiKey: ""

  # Use existing secret for credentials
  # Secret must contain the key: api-key
  existingSecret: ""

  # Request timeout in seconds (default: 60)
  requestTimeout: 60

  # Connection establishment timeout in seconds (default: 10)
  connectTimeout: 10

  # WebSocket write timeout in seconds (default: 30)
  writeTimeout: 30

  # Maximum concurrent API requests to TrueNAS (default: 10)
  # Lower this if TrueNAS becomes overloaded with many PVC operations
  maxConcurrentRequests: 10

  # Size of the TrueNAS WebSocket connection pool the controller multiplexes API
  # calls across (valid range 1..16). Left null by default so the key is NOT
  # rendered into the ConfigMap and the driver applies its own default of 5 —
  # keeping the default render compatible with the v1.3.0 strict config parser,
  # which has no maxConnections field. Set a value to override; values outside
  # the range are a startup validation error.
  maxConnections: null

# ZFS configuration
zfs:
  # Parent dataset for volumes (required — the driver refuses to start without it)
  parentDataset: ""

  # Additional ZFS properties to set on newly created datasets/zvols,
  # e.g. {compression: "zstd", dedup: "off"}. When empty (the default),
  # no properties are set and new datasets inherit from the parent
  # dataset — matching the driver's default behavior.
  datasetProperties: {}

  # Block size for newly-created zvols
  zvolBlocksize: 16K

  # Thick-provision block zvols with a full refreservation. The default keeps
  # zvols sparse/thin-provisioned.
  zvolEnableReservation: false

  # Dataset quota enforcement
  enforceQuota: true

  # Create independent volumes from snapshots using a local ZFS send/receive.
  # Keep false to preserve the existing ZFS clone behavior. Volume-source
  # copies remain clones regardless of this setting.
  detachedVolumesFromSnapshots: false

  # Timeout in seconds for waiting for a zvol to be ready after cloning
  # Increase this for slow systems, heavily loaded TrueNAS, or large clones
  # (default: 60 seconds)
  zvolReadyTimeout: 60

  # Allow DeleteVolume to recursively destroy snapshots not created by the CSI
  # driver. Keep false unless those snapshots are deliberately disposable.
  # This authorizes destroying snapshots the driver has SEEN and classified; it
  # is NOT a blind-destroy switch. When the snapshot listing itself fails, the
  # delete refuses regardless of this setting.
  destroyForeignSnapshotsOnDelete: false

  # Place a deletion-proof ZFS hold (the fixed `truenas` tag) on every CSI
  # VolumeSnapshot at create so foreign actors — a box-wide periodic-snapshot
  # task's pruning, an admin, replication retention — cannot destroy it (they hit
  # EBUSY). The driver's own delete/tombstone/reaper paths release the hold first,
  # so it never wedges the driver's lifecycle. Default false: no holds are placed
  # and the rendered config carries no holdCsiSnapshots key (GF2/E1).
  holdCsiSnapshots: false

  # Controller-wide DEFAULT schedule for driver-managed periodic snapshots
  # (GF2/E2): a five-field cron string "minute hour dom month dow". Empty (the
  # default) disables driver-managed periodic snapshots globally. A StorageClass
  # `snapshotSchedule` parameter overrides this per class. The rendered config
  # carries no snapshotSchedule key while empty (default render stays identical).
  snapshotSchedule: ""

  # Controller-wide DEFAULT bounded retention for driver-managed periodic
  # snapshots (GF2/E2), e.g. "24h", "30d", "2w", "6M", "1y". Empty resolves to a
  # 30d safety bound. TrueNAS 26.0 retention is time-based only (no count cap).
  snapshotRetention: ""

  # Promote clone-restored volumes in the background reconcile pass to drop their
  # origin-snapshot pin once each is the sole dependent of its origin (GF2/E3),
  # letting the tombstone reaper reclaim the source snapshot and the source volume
  # become destroyable. Default false: clones keep their origin pin as before and
  # the rendered config carries no promoteRestoredClones key.
  promoteRestoredClones: false

  # Report per-volume quota/usage from ControllerGetVolume (GF2/E4): one extra
  # pool.dataset.query per ControllerGetVolume feeds the volume_used_bytes /
  # volume_quota_bytes / volume_near_quota metrics and a near-quota
  # VolumeCondition (abnormal above 95% of the binding limit). Default false:
  # no extra call and the rendered config carries no reportVolumeUsage key.
  #
  # SCOPE. Every volume class is measured against the limit ZFS actually enforces
  # on it, and against the usage measurement THAT limit governs:
  #   * NFS filesystems  -> refquota vs referenced (the bound the driver itself
  #                         writes), or quota vs used when an operator set a real
  #                         quota; the tighter of the two binds. Space held by
  #                         snapshots does NOT count against refquota, so a volume
  #                         with large snapshots is not reported near-quota on
  #                         their account.
  #   * iSCSI / NVMe-oF  -> volsize vs referenced. A zvol carries neither quota
  #                         nor refquota, so volsize IS its capacity. This is
  #                         BACKEND occupancy of the zvol, not guest-filesystem
  #                         fullness, which the driver cannot see.
  # A volume with no limit at all publishes quota 0 (unlimited) and is never
  # reported near-quota.
  reportVolumeUsage: false

# NFS configuration
nfs:
  # Enable NFS support
  enabled: true

  # NFS server address (defaults to TrueNAS host)
  server: ""

  # Networks allowed to mount dynamically-created shares. An empty list allows
  # all networks and should be restricted in production.
  shareAllowedNetworks: []

  # maproot_* and mapall_* are MUTUALLY EXCLUSIVE in TrueNAS: sharing.nfs.create
  # rejects a payload carrying both. To use mapall, clear the maproot values here
  # (or, per StorageClass, set nfsMaprootUser: "" and nfsMaprootGroup: ""). The
  # schema and the driver both reject the combination rather than letting it
  # surface as an opaque middleware error at CreateVolume.
  shareMaprootUser: root
  shareMaprootGroup: wheel
  shareMapallUser: ""
  shareMapallGroup: ""

  # Default `security` list for newly created exports: SYS, KRB5, KRB5I, KRB5P.
  # EMPTY (the default) omits the field entirely, which is exactly what the
  # driver has always sent and leaves TrueNAS on AUTH_SYS. Override per class
  # with the StorageClass `nfsSecurity` parameter. Existing shares are never
  # rewritten — security is a create-time property of a volume.
  #
  # FAIL CLOSED: KRB5/KRB5I/KRB5P here require krbEnabled: true below. This list
  # is stamped on EVERY newly created export, so a Kerberos mode on a box with no
  # KDC/keytab would mean dead mounts fleet-wide. The coupling is enforced by
  # this chart's values.schema.json AND independently by the driver at config
  # load — a hand-written ConfigMap bypasses the schema entirely, and the
  # controller refuses to start rather than build unmountable exports.
  shareSecurity: []

  # Publish the dataset's read-only .zfs/snapshot tree through new exports.
  # TrueNAS only honors it when the export path is the dataset root, which is
  # always true for CSI volumes. Override per class with `nfsExposeSnapshots`.
  shareExposeSnapshots: false

  # Explicit acknowledgement that this TrueNAS has Kerberos configured for NFSv4
  # (nfs.config v4_krb plus a keytab). KRB5/KRB5I/KRB5P share security is
  # REJECTED at CreateVolume unless this is true, because a krb-only export on a
  # box with no keytab makes every mount fail with an opaque server error.
  krbEnabled: false

  # Validate a StorageClass's pinned NFS version (its `vers=`/`nfsvers=`
  # mountOption) against the GLOBAL nfs.config protocols, so a class asking for a
  # version the server does not enable fails with a clear message instead of a
  # cryptic mount error. Off by default: enabling it adds one cached nfs.config
  # read per controller lifetime. A SUCCESSFUL read is cached for that lifetime;
  # a REJECTION drops the cache, so enabling the missing version on the appliance
  # is picked up by the next CreateVolume with no controller restart. It gates
  # NEW volumes only — an idempotent replay of an existing volume still succeeds.
  versionPreflight: false

  # HARD RULE — opt-in only. Non-empty makes the controller MUTATE the GLOBAL
  # TrueNAS NFS service at startup so the listed major versions (NFSV3/NFSV4)
  # are enabled. That is a service-wide write affecting EVERY export on the
  # appliance, driver-managed or not. The supported default is the read-only
  # versionPreflight above. Values: NFSV3, NFSV4.
  #
  # nfs.update SETS the protocol list, it does not union with it, so "only adds,
  # never removes" only holds while the CURRENT list is readable. If nfs.config
  # reports no protocols, the driver hard-aborts the write instead of guessing.
  ensureProtocols: []

  # --- Performance mount-option profiles -------------------------------------
  # NFS version selection is a NODE-side mount option, not a share property:
  # there is no `vers` field on sharing.nfs.*. Set it on a StorageClass's
  # `mountOptions` (see storageClasses below). Validated profiles:
  #
  #   v4.1-throughput: nfsvers=4.1,nconnect=8,hard,noatime,rsize=1048576,wsize=1048576
  #   v4.1-lowlat:     nfsvers=4.1,nconnect=4,hard,noatime,ac
  #   v3-compat:       nfsvers=3,hard,noatime
  #
  # `nconnect` (multiple TCP connections behind one NFSv4.1 session — session
  # trunking) is a pure client-side option needing no server state, and the
  # kernel silently ignores it on v3. The driver passes mountOptions through
  # unchanged and only logs a warning for contradictory combinations.

# iSCSI configuration
iscsi:
  # Enable iSCSI support
  enabled: true

  # Target portal address (defaults to TrueNAS host)
  portal: ""

  # Target portal port
  portalPort: 3260

  # Explicit TrueNAS portal/initiator group associations for created targets
  # (install-specific database IDs). Leave empty to let the driver resolve
  # them automatically: it matches the portal listening on `portal` and picks
  # or creates an allow-all initiator group.
  targetGroups: []

  # Logical block size for NEWLY created extents only. Changing it never
  # re-geometries an existing volume: the driver records the geometry of every
  # extent it creates or observes on the volume's own dataset and replays THAT on
  # every later rebuild, so a changed value here can never be laid over data
  # written against the old one. See docs/reference/storageclass.md, "Geometry is
  # recorded, never guessed".
  extentBlocksize: 512
  # Disable physical block size reporting on created extents. Same rule: new
  # extents only, and the value each volume got is recorded per volume.
  extentDisablePhysicalBlocksize: false
  extentRpm: SSD
  # extentAvailThreshold was removed: it was never wired to anything. The schema
  # still accepts the old key (ignored) so existing values files pass validation.

  # Timeout in seconds to wait for iSCSI device to appear after login
  # Increase this for heavily loaded nodes or slow networks
  deviceWaitTimeout: 60

  # Debounce window in milliseconds for iSCSI service reloads
  # Multiple volume creations within this window will trigger a single reload
  # This prevents reload storms during bulk volume provisioning (default: 2000ms)
  serviceReloadDebounce: 2000

  # iSCSI CHAP authentication. Strictly opt-in: with enabled=false (default)
  # every target group stays authmethod=NONE and nothing CHAP-related renders
  # into the ConfigMap, so behavior is identical to a pre-CHAP deployment.
  # Credentials are NEVER set here; they are supplied per-StorageClass via the
  # CSI provisioner/node-stage secret refs (see chapSecretName on a
  # storageClasses[] entry and docs/reference/storageclass.md).
  chap:
    # Opt the controller into CHAP peer management. Default off.
    enabled: false
    # Optional operator-pinned iscsi.auth tag. 0 means derive a deterministic
    # per-StorageClass tag.
    tag: 0
    # Default authmethod hint for the controller. The effective per-volume mode is
    # determined at CreateVolume by the CHAP Secret (presence of mutualUsername
    # selects CHAP_MUTUAL) and stamped immutably on the volume; this flag does not
    # override an existing volume's stored mode. Default one-way.
    mutual: false

# NVMe-oF configuration
nvmeof:
  # Enable NVMe-oF support
  enabled: false

  # Transport type (tcp, rdma)
  transport: tcp

  # Target address (defaults to TrueNAS host)
  address: ""

  # Target port
  port: 4420

  # Allowed host NQNs. Used when subsystemAllowAnyHost is false. Include the
  # `nvme show-hostnqn` output from every Kubernetes node that may connect
  # (stable per node even when /etc/nvme/hostnqn is absent, e.g. on Flatcar).
  subsystemHosts: []

  # Allow any host NQN to connect. Enabling this bypasses subsystemHosts.
  subsystemAllowAnyHost: false

  # Install-wide NVMe-oF port performance tuning (GF-Sprint 4). These fields
  # live on a port that is SHARED across volumes, so they are install-wide only
  # (never per-StorageClass). Every field defaults to unset, which omits the API
  # parameter and keeps port creation identical to a pre-GF4 deployment. Named
  # portPerf (not port) to avoid colliding with nvmeof.port (the service port).
  #
  # CREATE-ONLY: these values are applied when the driver CREATES a port. On an
  # install whose ports already exist, changing them here has NO effect — the
  # driver reuses the existing port and logs a warning naming each drifted field.
  # TrueNAS refuses to change an enabled port while the target is running, so
  # applying a change means a maintenance window: disable the port, update it,
  # re-enable it.
  portPerf:
    # Inline write cutoff in bytes. Unset omits.
    inlineDataSize: null
    # Queue entries per connection. Unset omits.
    maxQueueSize: null
    # Enable T10-PI (protection information) on the port. Unset omits.
    piEnable: null

  # NVMe-oF multi-port multipath (GF-Sprint 4, E-6). When enabled, each subsystem
  # is associated with one port per address below (in addition to `address`), and
  # all addresses are advertised in the publish context under `addresses`.
  # Existing volumes are converged on their next publish, so every advertised
  # address really is associated with the subsystem.
  #
  # HONEST SCOPE — controller and node halves are shipped. NodeStage connects
  # every advertised address, converges missing live controllers on re-stage,
  # and lets native kernel NVMe multipath aggregate them under one subsystem and
  # namespace. Additional path failures are best-effort once one requested path
  # is live, and queue-depth iopolicy is requested when the kernel exposes it.
  # There is no ANA on this platform (nvmet rejects it), so all paths are equally
  # optimized — correct for a single controller. Backend exposure still costs
  # 2*(N-1) extra API calls per volume.
  #
  # Default off (single port, identical to pre-GF4).
  multipath: false
  # Additional storage transport addresses (IPs) to expose when multipath=true.
  # `address` is always included first, and duplicates are collapsed. Must be
  # non-empty when multipath=true.
  addresses: []

  # commandTimeout was removed: it was never wired to anything. The nvme CLI
  # timeout is commandTimeouts.nvme. The schema still accepts the old key
  # (ignored) so existing values files pass validation.

# Storage classes to create.
#
# `protocol` is emitted into the StorageClass parameters ONLY when set on an
# entry. Leave it unset to let the driver apply its sole-enabled-protocol
# fallback (single-protocol installs) or return its missing-parameter error
# (multi-protocol installs) instead of the chart silently forcing nfs. The
# bundled default class sets it explicitly.
storageClasses:
  - name: scale-nfs
    protocol: nfs
    isDefault: false
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    volumeBindingMode: Immediate
    mountOptions:
      - nfsvers=4
      - noatime
    # Additional CSI parameters, for example secret references
    extraParameters: {}
  # Opt-in example: a NVMe-oF class that restores snapshots as independent
  # detached copies instead of cheap ZFS clones, for DR-restore use cases where
  # the restored volume must not share blocks (and a snapshot's lifecycle) with
  # its source. Disabled by default so it is never created unless you set
  # `enabled: true` (and enable nvmeof above). The dominant hourly VolSync
  # source-backup mounts should keep the default clone behavior (omit
  # snapshotRestoreMode) to stay cheap.
  - name: scale-nvmeof-detached
    enabled: false
    protocol: nvmeof
    snapshotRestoreMode: detached
    isDefault: false
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    volumeBindingMode: Immediate
    mountOptions: []
    extraParameters: {}
  # Opt-in example: a curated ZFS performance class. `zfsPerformanceClass`
  # selects a vetted property preset (database | media | vm | backup | general)
  # layered UNDER zfs.datasetProperties, so an explicit operator key still wins.
  #
  # IMMUTABILITY: volblocksize is fixed when the dataset is CREATED (it is
  # immutable in ZFS itself), so changing a bound zvol PVC's class to one with a
  # different geometry is REJECTED with FailedPrecondition rather than silently
  # ignored — provision a new volume with the desired class and migrate the data.
  # recordsize/sync/compression/checksum/atime/special_small_block_size are
  # live-tunable, but the driver still does not retune existing datasets, and
  # recordsize-style changes would only affect NEW writes anyway.
  #
  # No preset sets logbias/primarycache/secondarycache: TrueNAS 26.0 rejects all
  # three on pool.dataset.create AND .update (probed live 2026-08-02). Set them
  # out of band with `zfs set`, e.g. on the CSI parent dataset.
  #
  # Disabled by default; enable it (and pair it with a matching mountOptions
  # profile) to use it. See docs/reference/storageclass.md for the full table.
  - name: scale-nfs-media
    enabled: false
    protocol: nfs
    zfsPerformanceClass: media
    isDefault: false
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    volumeBindingMode: Immediate
    mountOptions:
      - nfsvers=4.1
      - nconnect=8
      - hard
      - noatime
      - rsize=1048576
      - wsize=1048576
    extraParameters: {}
  # Opt-in example: an iSCSI class with CHAP authentication. Disabled by
  # default. Enable it (and iscsi.chap.enabled above) to create it. The CHAP
  # credentials live in a Kubernetes Secret named chapSecretName (created by
  # the operator, see docs/reference/storageclass.md); the chart only renders
  # the CSI secret-ref parameters, never the credential values. The same Secret
  # is used for both provisioner-secret (CreateVolume) and node-stage-secret
  # (NodeStageVolume).
  - name: scale-iscsi-chap
    enabled: false
    protocol: iscsi
    chapSecretName: scale-iscsi-chap
    # chapSecretNamespace defaults to the release namespace when unset.
    chapSecretNamespace: ""
    isDefault: false
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    volumeBindingMode: Immediate
    mountOptions: []
    extraParameters: {}
  # Opt-in example: an NFS class with ZFS-native encryption at rest
  # (GF-Sprint 1). Disabled by default. Enable it (and encryption.enabled above)
  # to create it. The passphrase lives in a Kubernetes Secret named
  # encryptionSecretName (created by the operator, see
  # docs/reference/storageclass.md); the chart only renders the CSI secret-ref
  # parameters, never the credential values. The same Secret is referenced for
  # provisioner-secret (CreateVolume), controller-publish-secret (publish-time
  # unlock) and node-stage-secret.
  #
  # CREATE-TIME ONLY: encryption is immutable for the life of a volume. An
  # encrypted class cannot also restore from a content source — the driver
  # refuses encryption + volumeContentSource at CreateVolume — so there is
  # deliberately no snapshotRestoreMode coupling here. Restore to a plaintext
  # class, or create new. See docs/reference/storageclass.md › "Encryption at
  # rest".
  - name: scale-nfs-encrypted
    enabled: false
    protocol: nfs
    encryptionSecretName: scale-nfs-encrypted
    # encryptionSecretNamespace defaults to the release namespace when unset.
    encryptionSecretNamespace: ""
    isDefault: false
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    volumeBindingMode: Immediate
    mountOptions:
      - nfsvers=4
      - noatime
    extraParameters: {}
  # Opt-in example: an iSCSI class tuned for 4K-aligned workloads (GF-Sprint 4).
  # Disabled by default. The block-protocol knobs are per-StorageClass parameters
  # (they flow through extraParameters verbatim). blocksize is IMMUTABLE for the
  # life of a volume — it is fixed at extent create and cannot change on an extent
  # that holds data. Pair iscsi/blocksize=4096 with zfs zvolBlocksize=16K. Every
  # knob is optional; an unset knob keeps the controller/backend default.
  - name: scale-iscsi-4k
    enabled: false
    protocol: iscsi
    isDefault: false
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    volumeBindingMode: Immediate
    mountOptions: []
    extraParameters:
      # Extent logical blocksize: one of 512, 1024, 2048, 4096 (default 512).
      iscsi/blocksize: "4096"
      # Report physical blocksize to the initiator (default true).
      iscsi/pblocksize: "true"
      # Per-target SCST queue depth: 32 or 128 (default: backend default).
      iscsi/queuedCommands: "128"
      # Disable cross-LUN XCOPY/ODX for stricter isolation (default true).
      iscsi/insecureTpc: "false"
      # Per-extent early-full warning percentage 1-99 (default: none).
      iscsi/availThreshold: "80"
  # Opt-in example: an NVMe-oF class with per-SC subsystem tuning (GF-Sprint 4).
  # Disabled by default. NVMe-oF PORT performance fields (inlineDataSize,
  # maxQueueSize, port piEnable) are NOT per-StorageClass — the port is shared
  # across volumes, so configure them install-wide under nvmeof.portPerf above;
  # supplying them here is rejected at CreateVolume.
  - name: scale-nvmeof-tuned
    enabled: false
    protocol: nvmeof
    isDefault: false
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    volumeBindingMode: Immediate
    mountOptions: []
    extraParameters:
      # Maximum number of I/O queues for the subsystem (default: backend default).
      nvmeof/qidMax: "128"
      # Enable T10-PI on the subsystem (advanced; validate initiator support).
      nvmeof/piEnable: "false"

# CSIDriver object settings.
csidriver:
  # fsGroupPolicy is effectively IMMUTABLE on a live CSIDriver and is a
  # driver-global choice — it cannot be set per StorageClass.
  #
  # Keep `File` (the default, unchanged) unless this installation is committed
  # to driver-applied NFSv4 ACLs. Under `File`, kubelet recursively chowns and
  # chmods each volume to a Pod's securityContext.fsGroup at publish, which
  # rewrites the mode-bearing ACEs of an ACL set via the StorageClass
  # `nfsACLTemplate`/`nfsACL` parameters. Options: File, None, ReadWriteOnceWithFSType.
  fsGroupPolicy: File

# Deprecated single-StorageClass configuration. When non-empty, this takes
# precedence over storageClasses for compatibility with existing values files.
# mountOptions and protocol are emitted only when explicitly set here.
storageClass: {}

# Optional VolumeSnapshotClass
snapshotClass:
  create: false
  name: scale-csi
  deletionPolicy: Delete
  labels: {}
  annotations: {}

# Sidecar containers versions
sidecars:
  # Baseline for every sidecar container. Each sidecar below may override or
  # extend this map; the main scale-csi container security contexts are kept
  # separate because the node plugin intentionally needs privilege and SYS_ADMIN.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Leader election configuration for sidecar containers
  # Increase these values if sidecars restart during API server instability
  # IMPORTANT: These values must satisfy: retryPeriod < renewDeadline < leaseDuration
  # The difference (leaseDuration - renewDeadline) determines how long after a failed
  # renewal the leader still holds the lease, giving time for recovery.
  leaderElection:
    # How long a leader lease is valid (default: 60s, upstream default: 15s)
    leaseDuration: 60s
    # How long a leader waits before renewing (default: 40s, upstream default: 10s)
    # Must be less than leaseDuration
    renewDeadline: 40s
    # How often to retry acquiring the lock (default: 10s, upstream default: 5s)
    # Must be less than renewDeadline
    retryPeriod: 10s

  provisioner:
    # The upstream image is a static Go binary and is compatible with the
    # explicit non-root UID used here; it only needs the mounted CSI socket.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
    image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
    timeout: 300s
    workerThreads: 10
    extraArgs: []
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  attacher:
    # The upstream image is a static Go binary and is compatible with the
    # explicit non-root UID used here; it only needs the mounted CSI socket.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
    image: registry.k8s.io/sig-storage/csi-attacher:v4.12.0
    # Bounds the ControllerPublish/Unpublish (attach/detach) deadline. 120s keeps
    # a stuck TrueNAS publish from holding the external-attacher's --timeout for
    # 300s; the driver's own publish path is far faster after the P1 RTT cuts.
    timeout: 120s
    workerThreads: 10
    extraArgs: []
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  resizer:
    # The upstream image is a static Go binary and is compatible with the
    # explicit non-root UID used here; it only needs the mounted CSI socket.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
    image: registry.k8s.io/sig-storage/csi-resizer:v2.2.1
    # Bounds the ControllerExpandVolume deadline (see attacher note).
    timeout: 120s
    workerThreads: 10
    extraArgs: []
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  snapshotter:
    # The upstream image is a static Go binary and is compatible with the
    # explicit non-root UID used here; it only needs the mounted CSI socket.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
    image: registry.k8s.io/sig-storage/csi-snapshotter:v8.6.0
    timeout: 300s
    workerThreads: 10
    extraArgs: []
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  nodeDriverRegistrar:
    # The registrar creates and removes its registration socket below the
    # mounted /registration hostPath. Keep the image root for that hostPath's
    # standard root-owned permissions; the common baseline still removes all
    # capabilities, forbids privilege escalation, and makes the root filesystem
    # read-only because all writes land on mounted socket directories.
    securityContext: {}
    # The node DaemonSet uses hostNetwork: true, so this endpoint binds on the
    # host and consumes the port on every node. Keep the default separate from
    # the driver's 9809 and liveness sidecar's 9808; choose another free port
    # when a node already uses 9810. Disabling this removes the endpoint and
    # both registrar probes.
    healthProbe:
      enabled: true
      port: 9810
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  livenessProbe:
    # The upstream image is a static Go binary and is compatible with the
    # explicit non-root UID used here; it only needs the mounted CSI socket.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
    image: registry.k8s.io/sig-storage/livenessprobe:v2.19.0
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  # External health monitor controller (volume-health sidecar). Strictly opt-in
  # (default off): with enabled=false no container and no extra RBAC render, so
  # the default manifest is byte-identical. The node-side stale-mount pre-gate
  # and controller-side VolumeCondition (both zero-new-API) are always on; this
  # sidecar additionally emits Kubernetes Events for abnormal volumes.
  #
  # STEADY-STATE API COST when enabled: because Scale-CSI advertises
  # LIST_VOLUMES, external-health-monitor v0.18.0 drives the ListVolumes path and
  # reads Entry.Status.VolumeCondition; it does NOT also issue per-PV
  # ControllerGetVolume (it picks ListVolumes OR per-PV ControllerGetVolume, never
  # both). So the background load is ONE periodic ListVolumes (a single
  # pool.dataset.query) per interval, NOT part of the request-path golden totals.
  # `interval` renders both --list-volumes-interval (the ACTIVE cadence for this
  # driver) and --monitor-interval (the fallback cadence used only by a driver
  # that lacks LIST_VOLUMES). Image tag is pinned (G2: v0.18.0 is the current
  # published release) — do not float it.
  healthMonitor:
    enabled: false
    # The upstream image is a static Go binary and is compatible with the
    # explicit non-root UID used here; it only needs the mounted CSI socket.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
    image: registry.k8s.io/sig-storage/csi-external-health-monitor-controller:v0.18.0
    interval: 60s
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

# Service account configuration
serviceAccount:
  # Create service accounts
  create: true

  # Annotations for service accounts
  annotations: {}

  # Names to use for created or existing component ServiceAccounts
  controllerName: ""
  nodeName: ""

# RBAC configuration
rbac:
  # Create RBAC resources
  create: true

# Pod security context
podSecurityContext:
  runAsNonRoot: false  # Required for mount operations
  fsGroup: 0

# Container security context (for node plugin)
securityContext:
  privileged: true
  capabilities:
    add:
      - SYS_ADMIN

# Driver HTTP health-check cache.
# Both bundled Kubernetes probes run at periodSeconds: 10. The default 5s TTL has
# ALWAYS expired before the next kubelet probe, so it never serves a hit on that
# probe path today; it only shields callers polling the health handlers faster
# than the TTL. Raising it toward or past the probe period trades freshness for
# reduced TrueNAS/backend load. Set 0s to disable reuse entirely.
health:
  cacheTTL: 5s

# Logging configuration
logging:
  # Verbosity level (0-10, higher is more verbose)
  verbosity: 2

# Metrics and monitoring configuration
metrics:
  # Enable metrics services (creates ClusterIP services for scraping)
  enabled: true

  # Metrics port (must match health-port in driver args)
  port: 9809

  # Service annotations (e.g., for prometheus.io/scrape annotations)
  service:
    annotations: {}

  # ServiceMonitor for Prometheus Operator
  serviceMonitor:
    # Create ServiceMonitor resources
    enabled: false

    # Additional labels for ServiceMonitor (for Prometheus selector)
    labels: {}

    # Scrape interval
    interval: 30s

    # Scrape timeout
    scrapeTimeout: 10s

  # PrometheusRule for driver health and error-rate alerts
  prometheusRule:
    enabled: false
    additionalLabels: {}
    # Replaces the bundled rules when non-empty
    rules: []
    # Pool-usage alert threshold (fraction 0..1) for ScaleCSIPoolNearFull. The
    # alert renders only when capacity.gaugeEnabled is also true (it needs the
    # scale_csi_pool_available_bytes / scale_csi_pool_capacity_bytes gauges).
    poolUsageThreshold: 0.85

  # Grafana sidecar-discoverable dashboard ConfigMap
  dashboards:
    enabled: false
    # ConfigMap annotations such as a Grafana folder selector
    annotations: {}

# Controller-side orphan detection and opt-in guarded cleanup.
reconcile:
  # Driver-owned replication.run_onetime zombie-job cleanup runs on controller
  # startup and every interval regardless of enabled or delete.enabled. The
  # default pass additionally performs detection (updating Prometheus gauges) plus
  # hygiene of the driver's OWN bookkeeping user properties on the parent
  # dataset: stale in-flight creation markers and orphaned tombstone-ledger
  # entries are retired with live staleness proof. Backend OBJECT deletion —
  # volumes, snapshots, tombstone reaping — happens only behind delete.enabled.
  enabled: true

  # Interval between controller reconcile passes (including the job sweep).
  # Must be a Go duration in whole h/m/s segments (e.g. "1h", "90m", "1h30m");
  # fractional ("1.5h") and sub-second units are rejected by the schema.
  #
  # COUPLING: the ScaleCSIReconcileStalled alert threshold is DERIVED from this
  # value (3x interval, rendered to seconds by the chart), so lengthening the
  # interval lengthens the stall threshold in lockstep — no separate alert knob
  # to keep in sync. Keep alertAfter (below) strictly greater than 2x interval.
  interval: 1h

  # Managed backend objects must be older than this before they are orphaned.
  minOrphanAge: 24h

  # Prometheus alert hold time. Keep this strictly greater than 2x interval.
  alertAfter: 2h5m

  spentRestore:
    # Classify and (under delete.enabled) reap spent VolSync restore
    # VolumeSnapshots — the volsync-*-dst-dest* objects whose source PVC is
    # Released or gone. This is VolSync application policy; deployments that do
    # not run VolSync can set this false to skip the classification entirely.
    # Orphan volume/snapshot detection, orphaned-share detection, and tombstone
    # sweeping are unaffected and still run. Default: true.
    enabled: true


  # Relocate the driver's durable bookkeeping (tombstone ledger + in-flight
  # markers) from the inheritable parent dataset to a dedicated non-inheriting
  # .csi-bookkeeping child (lossless dual-read migration). Prevents ledger
  # entries from being inherited by every snapshot, which inflates
  # zfs.resource.snapshot.query payloads. cleanupParent additionally permits
  # removing parent-side entries after a confirmed copy (keep false for the
  # first soak).
  #
  # DOWNGRADE WARNING: once enabled has been true and entries live on the child,
  # do NOT flip it back to false. Reads consult the child only while enabled, so
  # disabling orphans any child-side markers/ledger entries from crash recovery
  # and GC — they become invisible and can no longer be acted on. The supported
  # way to drain bookkeeping off the parent is the cleanupParent flow (copy to
  # the child, then remove confirmed copies from the parent), not disabling the
  # relocation.
  bookkeeping:
    enabled: false
    cleanupParent: false

  # Tombstone reaper tuning.
  tombstoneReaper:
    # Bounded-scan fallback for the deferred-delete tombstone reaper. When a
    # reconcile pass finds ZERO tombstones through the ledger-driven path (the
    # production failure mode where lost/missing tombstone-ledger entries strand
    # tombstone-shaped snapshots forever), do ONE bounded snapshot scan of the
    # parent (limit 500) and reap tombstone-shaped snapshots proven by either a
    # ledger entry OR (tombstone shape + source-dataset ownership stamp + age
    # gate). The ledger-driven reaper is unchanged when it finds tombstones.
    # Default: false.
    scanFallback:
      enabled: false
  delete:
    # SAFETY: guarded deletion is opt-in and disabled by default. When enabled,
    # a CronJob runs --mode=reconcile and backend cleanup still goes through the
    # driver's existing DeleteVolume/DeleteSnapshot dependency guards.
    #
    # NOTE: on TrueNAS 26.0 (no ZFS deferred destroy) deleting a snapshot that
    # still has a restored clone leaves a driver-tombstoned snapshot behind by
    # design. Reaping those released tombstones is part of this guarded delete
    # pass, so it only happens when delete.enabled is true; with it disabled the
    # backlog stays visible in the scale_csi_tombstone_snapshots{,_bytes}
    # gauges (detection is always on).
    enabled: false
    schedule: "0 4 * * *"
    # Maximum successful deletions across all object types in one run.
    maxPerRun: 5

# Session garbage collection configuration (node plugin only)
# Periodically cleans up orphaned iSCSI/NVMe-oF sessions that may leak
# when pods are deleted, nodes restart, or unstage operations fail
sessionGC:
  # Enable periodic garbage collection (default: true). Set this false to
  # disable GC; an enabled zero/negative interval uses the 300-second default.
  enabled: true

  # Interval between GC runs in seconds (default: 300 = 5 minutes)
  interval: 300

  # Grace period before cleaning up orphaned sessions in seconds (default: 60)
  # Sessions must be orphaned for this duration before cleanup
  gracePeriod: 60

  # Dry run mode - logs orphaned sessions without disconnecting (default: false)
  # Useful for monitoring without taking action
  dryRun: false

  # Run garbage collection once during startup
  runOnStartup: true

  # Delay before startup garbage collection in seconds
  startupDelay: 5

  # Enable protocol-specific session collection
  iscsiEnabled: true
  nvmeofEnabled: true

# API resilience configuration
resilience:
  circuitBreaker:
    # The driver currently defaults to disabled when this key is absent
    enabled: false
    failureThreshold: 5
    timeout: 30
  retry:
    maxAttempts: 3
    initialDelay: 500
    maxDelay: 5000
    backoffMultiplier: 2.0
  rateLimiting:
    # maxConcurrentRequests was removed: it was never wired to anything. The API
    # concurrency limit is truenas.maxConcurrentRequests. The schema still accepts
    # the old key so existing values files do not fail validation, but it is ignored.
    maxConcurrentLogins: 2

# Host command timeouts in seconds
commandTimeouts:
  mount: 30
  format: 300
  iscsi: 10
  nvme: 30
