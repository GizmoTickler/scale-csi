{{- $root := . -}}
{{- /* The rendered class set and each class's parameter map come from shared
     helpers (see _helpers.tpl) so templates/controller-rbac.yaml derives its
     Secret rule from exactly what this template ships, instead of from a
     second, drifting copy of the same logic. */}}
{{- $enabledClasses := include "scale-csi.storageClassList" . | fromJsonArray -}}
{{- range $index, $storageClass := $enabledClasses }}
{{- if $index }}
---
{{- end }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ $storageClass.name }}
  labels:
    {{- include "scale-csi.labels" $root | nindent 4 }}
  {{- if $storageClass.isDefault }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  {{- end }}
provisioner: {{ include "scale-csi.driverName" $root }}
reclaimPolicy: {{ default "Delete" $storageClass.reclaimPolicy }}
volumeBindingMode: {{ default "Immediate" $storageClass.volumeBindingMode }}
allowVolumeExpansion: {{ if hasKey $storageClass "allowVolumeExpansion" }}{{ $storageClass.allowVolumeExpansion }}{{ else }}true{{ end }}
{{- with $storageClass.mountOptions }}
mountOptions:
  {{- toYaml . | nindent 2 }}
{{- end }}
parameters:
  {{- $parameters := include "scale-csi.storageClassParameters" (dict "root" $root "class" $storageClass) | fromJson }}
  {{- toYaml $parameters | nindent 2 }}
{{- end }}
