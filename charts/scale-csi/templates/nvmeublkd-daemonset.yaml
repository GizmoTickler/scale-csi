{{- $nvmeof := .Values.nvmeof | default dict }}
{{- $ublk := $nvmeof.ublk | default dict }}
{{- $daemon := $ublk.daemon | default dict }}
{{- /* Deployed whenever the ublk data path is in use (one value turns the
     whole data path on), unless daemon.enabled=false says the operator runs
     nvmeublkd as a host service. Turning the data path off removes it, so
     move every volume off ublk first (see the chart README). */}}
{{- if include "scale-csi.nvmeublkdDeployed" . }}
{{- $image := $daemon.image | default dict }}
# nvmeublkd: the per-node userspace NVMe/TCP daemon behind the ublk data path.
# One process owns every /dev/ublkbN on its node and outlives node-plugin
# restarts; the node plugin drives it over /run/nvmeublk/nvmeublkd.sock.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "scale-csi.fullname" . }}-nvmeublkd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scale-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: nvmeublkd
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  # One node at a time. SIGTERM is a handover (drain, leave the devices, exit)
  # and the replacement reattaches them, so a node's I/O pauses for the gap.
  # maxSurge MUST stay 0: two daemons would contend for the socket and the
  # devices.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      {{- include "scale-csi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nvmeublkd
  template:
    metadata:
      labels:
        {{- include "scale-csi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nvmeublkd
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      priorityClassName: {{ $daemon.priorityClassName | default "system-node-critical" }}
      # Covers the daemon's bounded 5 s drain on SIGTERM.
      terminationGracePeriodSeconds: {{ $daemon.terminationGracePeriodSeconds | default 15 }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      # Scheduled exactly where the node plugin is, so every node that can
      # stage a volume has a daemon.
      {{- with .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nvmeublkd
          image: {{ include "scale-csi.nvmeublkdImage" (dict "root" $ "daemon" $daemon) | quote }}
          imagePullPolicy: {{ $image.pullPolicy | default "IfNotPresent" }}
          # The binary is at /nvmeublk in the image (a glibc runtime: the
          # allocator of a static musl build halves small-I/O throughput).
          command: ["/nvmeublk", "daemon"]
          env:
            # The volumes this node must hold: the daemon sizes each volume's
            # default layout so that many fit in its zero-copy buffer tables.
            # Listed first, so an extraEnv entry of the same name wins.
            - name: NVMEUBLK_MAX_VOLUMES
              value: {{ $ublk.maxVolumesPerNode | default 32 | int | quote }}
            {{- with $daemon.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # ublk device control, io_uring, mlockall and NAPI busy polling.
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-dev
              mountPath: /dev
            - name: nvmeublk-run
              mountPath: /run/nvmeublk
          {{- with $daemon.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        - name: nvmeublk-run
          hostPath:
            path: /run/nvmeublk
            type: DirectoryOrCreate
{{- end }}
