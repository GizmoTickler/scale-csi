apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ include "scale-csi.driverName" . }}
  labels:
    {{- include "scale-csi.labels" . | nindent 4 }}
spec:
  # These fields are immutable after the CSIDriver is created.
  # Indicates the driver requires an attach operation
  attachRequired: true
  # Requests pod information in NodePublishVolume calls
  podInfoOnMount: true
  # Storage capacity tracking
  {{- /* UPGRADE NOTE: opt-in via capacity.enabled (default false => byte-identical render). spec.storageCapacity is mutable, but flipping true -> false leaves orphan CSIStorageCapacity objects: the external-provisioner GCs them via ownerref on Deployment delete, yet a toggle-off WITHOUT a redeploy leaks them, so disabling capacity requires deleting the driver's csistoragecapacities (no finalizer). Helm-side comment so output stays byte-identical. */}}
  storageCapacity: {{ .Values.capacity.enabled }}
  # Volume lifecycle modes
  volumeLifecycleModes:
    - Persistent
  # FS group policy
  {{- /* DEFAULT IS UNCHANGED (`File`) and must stay that way for existing
       installs: fsGroupPolicy is effectively immutable on a live CSIDriver, and
       flipping it would change fsGroup semantics for EVERY already-provisioned
       volume. `File` makes kubelet recursively chown/chmod a volume to a Pod's
       securityContext.fsGroup at publish; on a volume carrying a driver-applied
       NFSv4 ACL (StorageClass nfsACLTemplate/nfsACL) that rewrites the
       mode-bearing ACEs and silently defeats the ACL. An operator who commits an
       installation to ACL-managed volumes can set csidriver.fsGroupPolicy=None;
       the driver additionally sets nfs41_flags.protected=true on every ACL it
       applies and emits a Warning event on each ACL-carrying volume.
       Helm-side comment so the rendered output stays byte-identical. */}}
  fsGroupPolicy: {{ .Values.csidriver.fsGroupPolicy | default "File" }}
