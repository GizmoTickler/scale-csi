{{- if and .Values.backendHealth.enabled (gt (int .Values.controller.replicas) 1) }}
{{- fail "backendHealth.enabled requires controller.replicas=1: the poller has no leader election, and Deployment termination/eviction/drain can overlap producers even when rollout surge is zero" }}
{{- end }}
{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scale-csi.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scale-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  # Render an explicit strategy in BOTH fencing modes so Helm always owns the
  # field. Off mode previously rendered no strategy block, so the API server
  # defaulted RollingUpdate and Helm's three-way merge never managed it; the
  # off -> additive upgrade then failed in production (2026-07-22) because the
  # server-defaulted rollingUpdate residue made the Recreate strategy invalid.
  {{- if and (eq .Values.fencing.mode "off") .Values.backendHealth.enabled }}
  # Off mode would allow overlapping controllers during a rollout, but the
  # backend-health poller has NO leader-election gate, so an overlap means two
  # processes publishing independently sampled scale_csi_pool_* series that every
  # alert merges with `max by (pool)` — divergence class 7, replica skew. Surge 0
  # makes the rollout NON-OVERLAPPING (the old pod terminates before the new one
  # is created), which is the single-producer invariant the taxonomy promises,
  # without Recreate's stricter semantics elsewhere. It is only an invariant at
  # controller.replicas=1: more replicas are more producers by construction, and
  # ScaleCSIPoolHealthProducerSkew is what detects that.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  {{- else if eq .Values.fencing.mode "off" }}
  # Off mode allows overlapping controllers during a rollout. RollingUpdate is
  # the Kubernetes default, declared explicitly (with its default surge and
  # unavailable) so the field is Helm-owned and the additive upgrade can replace
  # it cleanly.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  {{- else }}
  # Fencing reconcilers are in-process singleton writers. Recreate prevents an
  # old and new controller pod from overlapping during a rollout.
  strategy:
    type: Recreate
    # Explicit null removes a live Deployment's server-defaulted RollingUpdate
    # field during the required off -> additive Helm upgrade. Leaving that
    # three-way-merge residue would make the Recreate strategy invalid.
    rollingUpdate: null
  {{- end }}
  selector:
    matchLabels:
      {{- include "scale-csi.controllerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scale-csi.controllerSelectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.truenas.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Controller pod security context: the shared podSecurityContext
      deep-merged with the controller-only override (controller keys win, same
      mergeOverwrite pattern as scale-csi.sidecarSecurityContext). This is what
      applies the default RuntimeDefault seccomp profile to the controller pod
      only — the node DaemonSet renders the shared map unchanged because its
      privileged containers must stay unconfined. */}}
      {{- $controllerPodSecurityContext := deepCopy (.Values.podSecurityContext | default dict) }}
      {{- with .Values.controller.podSecurityContext }}
      {{- $controllerPodSecurityContext = mergeOverwrite $controllerPodSecurityContext . }}
      {{- end }}
      {{- with $controllerPodSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "scale-csi.controllerServiceAccountName" . }}
      priorityClassName: {{ .Values.controller.priorityClassName }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.controller.affinity }}
      affinity:
        {{- toYaml .Values.controller.affinity | nindent 8 }}
      {{- else }}
      {{- if gt (int .Values.controller.replicas) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "scale-csi.controllerSelectorLabels" . | nindent 20 }}
      {{- end }}
      {{- end }}
      containers:
        # CSI Driver
        - name: scale-csi
          image: {{ include "scale-csi.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.controller.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "-endpoint=unix://{{ include "scale-csi.socketPath" . }}"
            - "-node-id=$(NODE_ID)"
            - "-driver-name={{ .Values.csiDriverName }}"
            - "-config=/etc/scale-csi/config.yaml"
            - "-mode=controller"
            - "-health-port={{ .Values.metrics.port }}"
            - "-startup-connect-timeout={{ .Values.startupConnectTimeout }}"
            - "-v={{ .Values.logging.verbosity }}"
          ports:
            - name: health
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if or .Values.truenas.apiKey .Values.truenas.existingSecret }}
            - name: TRUENAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "scale-csi.secretName" . }}
                  key: api-key
                  optional: true
            {{- end }}
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: {{ include "scale-csi.socketDir" . }}
            - name: config
              mountPath: /etc/scale-csi
              readOnly: true
            {{- with .Values.controller.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          {{- /* Startup probe budget, derived from startupConnectTimeout so the
               two cannot drift. The probe must survive the WHOLE retry window:
               initialDelay + failureThreshold*period > timeout. At the 5m
               default that is 10 + 30*10 = 310s > 300s, i.e. the historical
               values, and a raised startupConnectTimeout now raises the budget
               with it instead of silently reintroducing the crash-loop. */}}
          {{- $startupInitialDelay := 10 }}
          {{- $startupPeriod := 10 }}
          {{- $startupTimeoutSeconds := include "scale-csi.durationToSecondsCeil" .Values.startupConnectTimeout | int }}
          {{- $startupFailureThreshold := max 30 (add (div (sub $startupTimeoutSeconds $startupInitialDelay) $startupPeriod) 1) }}
          # Port 9808 is the liveness-probe SIDECAR, and it is the only endpoint
          # in this pod that means "the driver is SERVING". It answers 200 only
          # once /csi/csi.sock accepts a CSI Probe RPC, and refuses the
          # connection outright before that (upstream binds its HTTP server only
          # after the first successful Connect).
          #
          # This deliberately does NOT use /healthz on the metrics port. Both
          # the startup health server (cmd/scale-csi/startup.go) and the driver's
          # own health server (pkg/driver/health.go) map /healthz to an
          # unconditional 200, so it answers from the moment the process binds
          # the port — which, on the controller, is BEFORE the TrueNAS
          # connection has been retried even once. Pointing the startup probe
          # there made it pass at ~t=10s regardless of the backend, which armed
          # the livenessProbe below against port 9808 while Run() had not yet
          # created the socket: five failures later, restart at ~70s. That is
          # precisely the CrashLoopBackOff the startupConnectTimeout retry
          # window exists to prevent, so the 310s budget was never consumed.
          #
          # /readyz is not usable here either: the controller's isReady()
          # requires a live TrueNAS connection and, in strict fencing mode,
          # stays false until startup fencing converges, so gating startup on it
          # turns "unready but serving" into CrashLoopBackOff for a different
          # reason. Readiness is covered by the readinessProbe below. The node
          # DaemonSet CAN use /readyz because its isReady() is true immediately.
          startupProbe:
            httpGet:
              path: /healthz
              port: 9808
            initialDelaySeconds: {{ $startupInitialDelay }}
            timeoutSeconds: 3
            periodSeconds: {{ $startupPeriod }}
            failureThreshold: {{ $startupFailureThreshold }}
          # Same endpoint as the startup probe, and that is the point: once the
          # startup probe has proven the CSI socket is serving, liveness keeps
          # watching the same fact on a tight 60s budget. It only arms after the
          # startup probe succeeds, so it can no longer fire during the initial
          # TrueNAS retry window.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9808
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.metrics.port }}
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3

        # CSI Provisioner
        - name: csi-provisioner
          image: {{ .Values.sidecars.provisioner.image }}
          securityContext:
            {{- include "scale-csi.sidecarSecurityContext" (dict "common" $.Values.sidecars.securityContext "override" $.Values.sidecars.provisioner.securityContext) | nindent 12 }}
          args:
            - "--csi-address={{ include "scale-csi.socketPath" . }}"
            - "--v={{ .Values.logging.verbosity }}"
            - "--timeout={{ .Values.sidecars.provisioner.timeout }}"
            - "--worker-threads={{ .Values.sidecars.provisioner.workerThreads }}"
            # Leader election is always enabled, even at a single replica: a
            # fencing-off RollingUpdate transiently runs two controller pods, and
            # without LE both sidecars would act as active provisioner/attacher.
            - "--leader-election"
            - "--leader-election-namespace={{ .Release.Namespace }}"
            - "--leader-election-lease-duration={{ .Values.sidecars.leaderElection.leaseDuration }}"
            - "--leader-election-renew-deadline={{ .Values.sidecars.leaderElection.renewDeadline }}"
            - "--leader-election-retry-period={{ .Values.sidecars.leaderElection.retryPeriod }}"
            # (C10) Caps the exponential backoff on a FAILED CSI call. Upstream's
            # default is 5 minutes, which after a transient TrueNAS blip meant a
            # rejected ControllerUnpublishVolume backed off to once every 5m — the
            # single largest avoidable contributor to a node reboot stranding a
            # volume.
            - "--retry-interval-max={{ .Values.sidecars.retryIntervalMax }}"
            - "--extra-create-metadata"
            {{- if .Values.capacity.enabled }}
            - "--enable-capacity"
            # owner = controller Deployment (Deployment -> ReplicaSet -> Pod = 2)
            - "--capacity-ownerref-level=2"
            {{- if .Values.capacity.forImmediateBinding }}
            # Opt-in: publish CSIStorageCapacity for Immediate-binding
            # StorageClasses too. external-provisioner ignores Immediate classes
            # by default (the scheduler ignores capacity for immediate binding),
            # so this is only useful for non-scheduler capacity consumers.
            - "--capacity-for-immediate-binding"
            {{- end }}
            {{- end }}
            {{- range .Values.sidecars.provisioner.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if .Values.capacity.enabled }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: {{ include "scale-csi.socketDir" . }}
          resources:
            {{- toYaml .Values.sidecars.provisioner.resources | nindent 12 }}

        # CSI Attacher
        - name: csi-attacher
          image: {{ .Values.sidecars.attacher.image }}
          securityContext:
            {{- include "scale-csi.sidecarSecurityContext" (dict "common" $.Values.sidecars.securityContext "override" $.Values.sidecars.attacher.securityContext) | nindent 12 }}
          args:
            - "--csi-address={{ include "scale-csi.socketPath" . }}"
            - "--v={{ .Values.logging.verbosity }}"
            - "--timeout={{ .Values.sidecars.attacher.timeout }}"
            - "--worker-threads={{ .Values.sidecars.attacher.workerThreads }}"
            - "--leader-election"
            - "--leader-election-namespace={{ .Release.Namespace }}"
            - "--leader-election-lease-duration={{ .Values.sidecars.leaderElection.leaseDuration }}"
            - "--leader-election-renew-deadline={{ .Values.sidecars.leaderElection.renewDeadline }}"
            - "--leader-election-retry-period={{ .Values.sidecars.leaderElection.retryPeriod }}"
            # (C10) See the identical comment on the provisioner above.
            - "--retry-interval-max={{ .Values.sidecars.retryIntervalMax }}"
            {{- range .Values.sidecars.attacher.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: {{ include "scale-csi.socketDir" . }}
          resources:
            {{- toYaml .Values.sidecars.attacher.resources | nindent 12 }}

        # CSI Resizer
        - name: csi-resizer
          image: {{ .Values.sidecars.resizer.image }}
          securityContext:
            {{- include "scale-csi.sidecarSecurityContext" (dict "common" $.Values.sidecars.securityContext "override" $.Values.sidecars.resizer.securityContext) | nindent 12 }}
          args:
            - "--csi-address={{ include "scale-csi.socketPath" . }}"
            - "--v={{ .Values.logging.verbosity }}"
            - "--timeout={{ .Values.sidecars.resizer.timeout }}"
            - "--workers={{ .Values.sidecars.resizer.workerThreads }}"
            - "--leader-election"
            - "--leader-election-namespace={{ .Release.Namespace }}"
            - "--leader-election-lease-duration={{ .Values.sidecars.leaderElection.leaseDuration }}"
            - "--leader-election-renew-deadline={{ .Values.sidecars.leaderElection.renewDeadline }}"
            - "--leader-election-retry-period={{ .Values.sidecars.leaderElection.retryPeriod }}"
            # (C10) See the identical comment on the provisioner above.
            - "--retry-interval-max={{ .Values.sidecars.retryIntervalMax }}"
            - "--handle-volume-inuse-error=false"
            {{- range .Values.sidecars.resizer.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: {{ include "scale-csi.socketDir" . }}
          resources:
            {{- toYaml .Values.sidecars.resizer.resources | nindent 12 }}

        # CSI Snapshotter
        - name: csi-snapshotter
          image: {{ .Values.sidecars.snapshotter.image }}
          securityContext:
            {{- include "scale-csi.sidecarSecurityContext" (dict "common" $.Values.sidecars.securityContext "override" $.Values.sidecars.snapshotter.securityContext) | nindent 12 }}
          args:
            - "--csi-address={{ include "scale-csi.socketPath" . }}"
            - "--v={{ .Values.logging.verbosity }}"
            - "--timeout={{ .Values.sidecars.snapshotter.timeout }}"
            - "--worker-threads={{ .Values.sidecars.snapshotter.workerThreads }}"
            - "--leader-election"
            - "--leader-election-namespace={{ .Release.Namespace }}"
            - "--leader-election-lease-duration={{ .Values.sidecars.leaderElection.leaseDuration }}"
            - "--leader-election-renew-deadline={{ .Values.sidecars.leaderElection.renewDeadline }}"
            - "--leader-election-retry-period={{ .Values.sidecars.leaderElection.retryPeriod }}"
            {{- range .Values.sidecars.snapshotter.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: {{ include "scale-csi.socketDir" . }}
          resources:
            {{- toYaml .Values.sidecars.snapshotter.resources | nindent 12 }}

        # Liveness Probe
        - name: liveness-probe
          image: {{ .Values.sidecars.livenessProbe.image }}
          securityContext:
            {{- include "scale-csi.sidecarSecurityContext" (dict "common" $.Values.sidecars.securityContext "override" $.Values.sidecars.livenessProbe.securityContext) | nindent 12 }}
          args:
            - "--csi-address={{ include "scale-csi.socketPath" . }}"
            - "--probe-timeout=3s"
            - "--health-port=9808"
            - "--v={{ .Values.logging.verbosity }}"
          volumeMounts:
            - name: socket-dir
              mountPath: {{ include "scale-csi.socketDir" . }}
          resources:
            {{- toYaml .Values.sidecars.livenessProbe.resources | nindent 12 }}

        {{- if .Values.sidecars.healthMonitor.enabled }}
        # External Health Monitor (volume-health; opt-in via
        # sidecars.healthMonitor.enabled). Emits Events for abnormal volumes;
        # default off => no container => byte-identical render.
        - name: csi-external-health-monitor
          image: {{ .Values.sidecars.healthMonitor.image }}
          securityContext:
            {{- include "scale-csi.sidecarSecurityContext" (dict "common" $.Values.sidecars.securityContext "override" $.Values.sidecars.healthMonitor.securityContext) | nindent 12 }}
          args:
            - "--csi-address={{ include "scale-csi.socketPath" . }}"
            - "--leader-election"
            - "--leader-election-namespace={{ .Release.Namespace }}"
            # Scale-CSI advertises LIST_VOLUMES, so external-health-monitor
            # v0.18.0 drives the ListVolumes path, whose cadence is set by
            # --list-volumes-interval (NOT --monitor-interval). Render the active
            # flag from the configured interval; --monitor-interval is kept as the
            # fallback cadence for the ControllerGetVolume path a driver without
            # LIST_VOLUMES would use.
            - "--list-volumes-interval={{ .Values.sidecars.healthMonitor.interval }}"
            - "--monitor-interval={{ .Values.sidecars.healthMonitor.interval }}"
            - "--v={{ .Values.logging.verbosity }}"
          volumeMounts:
            - name: socket-dir
              mountPath: {{ include "scale-csi.socketDir" . }}
          resources:
            {{- toYaml .Values.sidecars.healthMonitor.resources | nindent 12 }}
        {{- end }}

      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "scale-csi.fullname" . }}-config
        {{- with .Values.controller.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
