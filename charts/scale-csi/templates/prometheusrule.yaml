{{- if .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "scale-csi.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scale-csi.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "scale-csi.fullname" . }}.rules
      rules:
        {{- if .Values.metrics.prometheusRule.rules }}
        {{- toYaml .Values.metrics.prometheusRule.rules | nindent 8 }}
        {{- else }}
        - alert: ScaleCSIControllerDown
          expr: absent(up{namespace={{ .Release.Namespace | quote }},service={{ printf "%s-controller-metrics" (include "scale-csi.fullname" .) | quote }}} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Scale CSI controller metrics target is down
            description: Prometheus has not observed an up Scale CSI controller target for five minutes.
        - alert: ScaleCSICircuitBreakerOpen
          expr: scale_csi_circuit_breaker_state == 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI TrueNAS circuit breaker is open
            description: The driver has stopped TrueNAS API calls while the circuit breaker is open.
        - alert: ScaleCSITrueNASConnectionDown
          expr: max(scale_csi_truenas_connection_status{job={{ printf "%s-controller-metrics" (include "scale-csi.fullname" .) | quote }}}) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Scale CSI controller is disconnected from TrueNAS
            description: The controller has reported no authenticated TrueNAS connection for five minutes.
        - alert: ScaleCSIHighTrueNASAPIFailureRate
          expr: (sum(rate(scale_csi_truenas_requests_total{status="error"}[5m])) / sum(rate(scale_csi_truenas_requests_total[5m]))) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI TrueNAS API failure rate is high
            description: More than 10% of TrueNAS API requests have failed for ten minutes.
        - alert: ScaleCSISustainedLockContention
          # Sprint 5 moved EBUSY lock-contention/in-progress outcomes OUT of
          # status="error" into status="benign_aborted" (E1), so the failure-rate
          # alert above no longer covers a sustained abort storm. This alert
          # restores that signal: the TrueNAS client returns non-connection API
          # errors immediately instead of retrying them, so sustained lock
          # contention remains an operational latency/retry symptom even though
          # each individual outcome is benign (codex M2 / opus hardening).
          expr: sum(rate(scale_csi_truenas_requests_total{status="benign_aborted"}[15m])) > 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI TrueNAS lock contention is sustained
            description: Benign lock-contention/in-progress aborts (status="benign_aborted") have exceeded 1 per second for fifteen minutes; an EBUSY abort storm elevates API load and publish latency though it is not a hard backend failure.
            runbook_url: docs/troubleshooting.md#performance-issues
        - alert: ScaleCSIOperationErrorsSustained
          expr: sum(rate(scale_csi_operations_total{job={{ printf "%s-controller-metrics" (include "scale-csi.fullname" .) | quote }},status="error",code!~"FailedPrecondition|AlreadyExists|Aborted"}[10m])) > 0.02
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI operations are failing
            description: Unexpected CSI controller operation errors have exceeded 0.02 operations per second for fifteen minutes.
        - alert: ScaleCSIOperationFailedPreconditionStuck
          # The sustained-errors alert above deliberately excludes
          # FailedPrecondition: it is usually a benign, self-resolving refusal
          # (a delete racing a detach, a tombstone awaiting its reaper). But a
          # FailedPrecondition that repeats CONTINUOUSLY on the same operation
          # is a wedged CO retry loop, and it is exactly the class that went
          # unpaged in the 2026-08-19 incident: one Released PV's DeleteVolume
          # failed identically every ~4 minutes for 22 hours (160 errors) with
          # no alert. Per-operation grouping keeps one wedged volume from
          # hiding behind healthy traffic on other operations. Two hours of
          # uninterrupted refusals is far beyond any benign race, while a
          # tombstone-blocked delete that clears at the next guarded-cleanup
          # run still fires here if that run is more than ~2.5h away — which is
          # the point: page on the stall, not after it resolves.
          expr: sum by (operation) (rate(scale_csi_operations_total{job={{ printf "%s-controller-metrics" (include "scale-csi.fullname" .) | quote }},status="error",code="FailedPrecondition"}[30m])) > 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: 'Scale CSI {{ "{{ $labels.operation }}" }} is stuck in a FailedPrecondition retry loop'
            description: 'CSI operation {{ "{{ $labels.operation }}" }} has returned FailedPrecondition continuously for two hours — a wedged retry loop, not a transient race. Typical cause: a DeleteVolume blocked behind a deferred-deletion tombstone until the next guarded-cleanup CronJob run. Check the controller log for the refusal message; it names the blocker and its clearing bound.'
            runbook_url: docs/troubleshooting.md#tombstone-blocked-deletevolume
        - alert: ScaleCSISpentRestoreSnapshotBacklog
          expr: max(scale_csi_spent_restore_snapshots{job={{ printf "%s-controller-metrics" (include "scale-csi.fullname" .) | quote }}}) > 0
          for: 48h
          labels:
            severity: warning
          annotations:
            summary: Scale CSI spent restore snapshots remain queued
            description: One or more spent restore snapshots have remained pending cleanup for forty-eight hours.
        - alert: ScaleCSISessionGCDisconnects
          expr: increase(scale_csi_gc_sessions_disconnected_total{job={{ printf "%s-node-metrics" (include "scale-csi.fullname" .) | quote }}}[1h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI garbage-collected storage sessions
            description: A node plugin disconnected at least one orphaned iSCSI or NVMe-oF session in the last hour.
        - alert: ScaleCSIFencingTakeoverSpike
          expr: sum(increase(scale_csi_fencing_takeover_total[1h])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI performed a synchronous fencing takeover
            description: A stale publication was forcibly revoked to hand the volume to another node. Any takeover is notable; investigate the fenced node.
            runbook_url: docs/guides/disaster-recovery.md#runbook-fencing-takeover-for-a-confirmed-dead-node
        - alert: ScaleCSIFencingProvenanceOverflow
          expr: increase(scale_csi_fencing_provenance_overflow_total[15m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: Scale CSI is refusing publishes on provenance overflow
            description: Additive fencing provenance exceeded the per-node cap; publishes fail closed with ResourceExhausted until grants drain.
            runbook_url: docs/guides/disaster-recovery.md#runbook-fencing-takeover-for-a-confirmed-dead-node
        - alert: ScaleCSIJobDispatcherUnsubscribed
          # Scoped to the controller job (codex H1): the gauge is published only
          # by controller-mode processes, but selecting the controller target
          # explicitly keeps the query correct even if a node target ever exposed
          # the series. `min` fires when ANY controller replica loses its
          # subscription.
          expr: min(scale_csi_job_dispatcher_subscribed{job={{ printf "%s-controller-metrics" (include "scale-csi.fullname" .) | quote }}}) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI degraded to pure-poll job waiting
            description: At least one controller replica has no pooled connection holding a live core.get_jobs subscription (pure-poll fallback); API load and latency are elevated.
            runbook_url: docs/troubleshooting.md#job-dispatcher-pure-poll-fallback
        - alert: ScaleCSIDeleteResidualCleanupFailing
          expr: sum(increase(scale_csi_delete_volume_orphan_cleanup_failures_total[1h])) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI DeleteVolume residual share cleanup is failing
            description: DeleteVolume succeeded on an absent dataset but best-effort residual share cleanup failed; the orphan reconcile sweeps the residue.
            runbook_url: docs/troubleshooting.md#clean-up-orphaned-truenas-resources
        {{- if .Values.reconcile.enabled }}
        - alert: ScaleCSIOrphanVolumesDetected
          expr: scale_csi_orphan_volumes > 0
          for: {{ .Values.reconcile.alertAfter }}
          labels:
            severity: warning
          annotations:
            summary: Scale CSI orphan volumes detected
            description: CSI-managed TrueNAS volumes have had no matching live Kubernetes PV handle for longer than the reconcile alert window.
        - alert: ScaleCSIOrphanSnapshotsDetected
          expr: scale_csi_orphan_snapshots > 0
          for: {{ .Values.reconcile.alertAfter }}
          labels:
            severity: warning
          annotations:
            summary: Scale CSI orphan snapshots detected
            description: CSI-managed TrueNAS snapshots have had no matching live VolumeSnapshotContent handle for longer than the reconcile alert window.
        - alert: ScaleCSIManualRecoveryTombstones
          expr: scale_csi_manual_recovery_tombstones > 0
          for: {{ .Values.reconcile.alertAfter }}
          labels:
            severity: warning
          annotations:
            summary: Scale CSI reaper refuses manual-recovery tombstones
            description: Driver-tombstoned snapshots have unproven creation-time identity and will never drain automatically; operator action required.
            runbook_url: docs/troubleshooting.md#tombstones-that-never-drain
        - alert: ScaleCSIRemnantVolumesDetected
          expr: scale_csi_remnant_volumes > 0
          for: {{ .Values.reconcile.alertAfter }}
          labels:
            severity: warning
          annotations:
            summary: Scale CSI remnant volumes detected
            description: Marker-proven unstamped remnant datasets from interrupted creates await guarded reap.
            runbook_url: docs/troubleshooting.md#clean-up-orphaned-truenas-resources
        - alert: ScaleCSITombstoneBacklog
          expr: scale_csi_tombstone_snapshots > 0
          for: 48h
          labels:
            severity: warning
          annotations:
            summary: Scale CSI tombstone backlog is not draining
            description: Driver-tombstoned deferred-delete snapshots have awaited reap for forty-eight hours.
            runbook_url: docs/troubleshooting.md#tombstones-that-never-drain
        - alert: ScaleCSITombstoneOldestStuck
          # The eligible-count gauge (ScaleCSITombstoneBacklog) cannot see an
          # age-gated tombstone. This is the 2026-08-18/20 incident class: one
          # tombstone sat ~51h with no page because it was invisible to the
          # eligible set for a full day.
          #
          # max() yields an empty label set; comparison with a scalar is
          # label-set correct (no `and`/`absent` pairing).
          expr: max(scale_csi_tombstone_oldest_age_seconds{job={{ printf "%s-controller-metrics" (include "scale-csi.fullname" .) | quote }}}) > 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Scale CSI has a deferred-delete tombstone older than 24h
            description: The oldest driver-owned tombstone awaiting reap (including age-gated ones the count gauge excludes) is more than 24 hours old. A blocked DeleteVolume will keep returning FailedPrecondition until the reaper clears it.
            runbook_url: docs/troubleshooting.md#tombstones-that-never-drain
        - alert: ScaleCSIReconcileStalled
          # The age threshold is DERIVED from the configured reconcile.interval
          # (3x the cadence, in seconds) instead of a hard-coded three hours, so
          # an operator who lengthens reconcile.interval no longer gets a false
          # critical before the next scheduled pass (codex M3). The coupling is
          # also documented next to reconcile.interval in values.yaml.
          #
          # A controller that has NEVER completed a reconcile exports the gauge
          # as 0, so the age is time()-0 (huge) and this alert trips after the
          # 15m hold. That is intentional: a reconcile that never succeeds is
          # worth paging on, not a false positive (opus informational note).
          expr: time() - max(scale_csi_reconcile_last_success_timestamp_seconds{job={{ printf "%s-controller-metrics" (include "scale-csi.fullname" .) | quote }}}) > {{ mul 3 (include "scale-csi.durationToSeconds" .Values.reconcile.interval | int) }}
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Scale CSI controller reconcile loop is stalled
            description: No reconcile pass has succeeded for over three times the configured reconcile.interval ({{ .Values.reconcile.interval }}); orphan detection is frozen. A controller that has never completed a reconcile also trips this alert.
            runbook_url: docs/troubleshooting.md#clean-up-orphaned-truenas-resources
        {{- end }}
        {{- if .Values.reconcile.delete.enabled }}
        - alert: ScaleCSITombstoneReapCapped
          # max() yields an empty label set; comparison with a scalar is
          # label-set correct.
          expr: max(scale_csi_tombstone_reap_last_skipped_on_cap{job={{ printf "%s-controller-metrics" (include "scale-csi.fullname" .) | quote }}}) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI delete-capable reap hit the per-run cap
            description: The last recorded delete-capable pass deferred work because reconcile.delete.maxPerRun was already spent. Capacity exhaustion is now a first-class gauge; do not infer it by comparing the backlog against a hardcoded fraction of the cap.
            runbook_url: docs/troubleshooting.md#tombstones-that-never-drain
        - alert: ScaleCSITombstoneReapStale
          # Fires only when a last-reap series EXISTS (a pass has been recorded).
          # A fresh install or delete.enabled=false exports no series, so this
          # cannot false-page those. 12h is two missed runs of the default
          # 6-hourly schedule; operators who override to a longer CronJob must
          # raise it. time()-max(...) is label-set correct (both sides empty).
          expr: time() - max(scale_csi_tombstone_reap_last_success_timestamp_seconds{job={{ printf "%s-controller-metrics" (include "scale-csi.fullname" .) | quote }}}) > 43200
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI delete-capable reap has not completed recently
            description: No delete-capable tombstone reap has been recorded for over twelve hours (two missed runs of the default 6-hourly CronJob). The reaper is broken or the CronJob is not running.
            runbook_url: docs/troubleshooting.md#tombstones-that-never-drain
        - alert: ScaleCSITombstoneReapNeverRan
          # delete.enabled=1 with no recorded pass: distinguished from a fresh
          # install with GC gated off (delete.enabled=0 AND absent timestamp).
          #
          # LABEL SETS: max(enabled) yields {}; absent(series{job=...}) yields
          # {job="..."}; plain `and` requires identical label sets and is
          # therefore always empty. Wrap the absent() argument in max() so both
          # sides are {}. Verified: max(x) and absent(max(y)) matches;
          # max(x) and absent(y) does not.
          expr: max(scale_csi_reconcile_delete_enabled{job={{ printf "%s-controller-metrics" (include "scale-csi.fullname" .) | quote }}}) == 1 and absent(max(scale_csi_tombstone_reap_last_success_timestamp_seconds{job={{ printf "%s-controller-metrics" (include "scale-csi.fullname" .) | quote }}}))
          for: 12h
          labels:
            severity: warning
          annotations:
            summary: Scale CSI guarded cleanup has never recorded a reap
            description: reconcile.delete.enabled is on but no delete-capable pass has been durably recorded. The CronJob has not completed since install (or every record write has failed). Distinct from a disabled reaper, which exports delete_enabled=0 and no timestamp series. 12h hold is two missed runs of the default 6-hourly schedule.
            runbook_url: docs/troubleshooting.md#tombstones-that-never-drain
        {{- end }}
        {{- if .Values.capacity.gaugeEnabled }}
        - alert: ScaleCSIPoolNearFull
          # Render the threshold directly (no Sprig `default`): the default lives
          # in values.yaml, and `default` treats a legitimate numeric 0 as empty,
          # silently rewriting it to 0.85 (codex M4).
          expr: (1 - (scale_csi_pool_available_bytes / scale_csi_pool_capacity_bytes)) > {{ .Values.metrics.prometheusRule.poolUsageThreshold }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI backend pool is nearly full
            description: Parent dataset usable capacity is above the configured threshold.
        {{- end }}
        {{- if .Values.zfs.reportVolumeUsage }}
        - alert: ScaleCSIVolumeNearQuota
          # GF2/E4: the per-volume near-quota gauge is populated only when
          # zfs.reportVolumeUsage is set, so the alert renders only then (the
          # default render carries no such series and stays byte-identical).
          expr: scale_csi_volume_near_quota == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI volume is near its quota
            description: A volume has exceeded 95% of its binding ZFS limit (refquota vs referenced, quota vs used, or a zvol's volsize) for fifteen minutes; writes will fail once the limit is reached.
        {{- end }}
        {{- if .Values.zfs.snapshotSchedule }}
        # GF2-fix4/M4. Every E2 failure path is deliberately NON-FATAL — the
        # driver logs, meters, emits a warning Event and continues — so an alert
        # is the ONLY way an operator learns the protection is absent. Each rule
        # below is gated on the value that turns its feature on, so the default
        # render stays byte-identical (the ScaleCSIVolumeNearQuota pattern).
        #
        # GATING CAVEAT: these three are gated on the controller-wide
        # zfs.snapshotSchedule. A deployment that schedules ONLY through per-
        # StorageClass `snapshotSchedule` parameters produces the same metrics but
        # renders no rules; set zfs.snapshotSchedule (or supply
        # metrics.prometheusRule.rules) to alert on it.
        - alert: ScaleCSIScheduledSnapshotTaskEnsureFailed
          # A volume was PROVISIONED and is Bound and healthy, with no
          # periodic-snapshot task at all. Nothing retries until the next
          # CreateVolume for that volume, and the discovery point is otherwise a
          # restore that finds no snapshots.
          expr: increase(scale_csi_scheduled_snapshot_task_ensure_failed_total[1h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI provisioned a volume without its periodic-snapshot task
            description: One or more volumes were provisioned in the last hour without driver-managed PITR; check the controller log for the failing StorageClass schedule/retention.
            runbook_url: docs/reference/storageclass.md#driver-managed-periodic-snapshots-gf2e2
        - alert: ScaleCSIScheduledSnapshotTaskDeleteFailed
          # The DELETE succeeded but the task did not go away. The stranded-task
          # sweep reclaims it only once the dataset is provably gone, so a
          # persistent non-zero rate means the corroboration write or the task
          # delete is wedging.
          expr: increase(scale_csi_scheduled_snapshot_task_delete_failed_total[1h]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI could not remove a volume's periodic-snapshot task
            description: DeleteVolume left a driver-owned periodic-snapshot task behind (the delete itself proceeded); the orphan reconcile sweep has work to do.
            runbook_url: docs/troubleshooting.md#clean-up-orphaned-truenas-resources
        - alert: ScaleCSINASTimezoneUnresolved
          # The zone is a LINK in the scheduled-snapshot ownership chain and the
          # delete path fails CLOSED without it: while this fires, every scheduled
          # volume's DeleteVolume returns FailedPrecondition.
          expr: increase(scale_csi_nas_timezone_unresolved_total[1h]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI cannot resolve the NAS civil timezone
            description: Driver-scheduled snapshots cannot be proven while the NAS timezone is unresolved, so they are preserved as foreign and scheduled volumes fail to delete.
            runbook_url: docs/production.md#backend-health
        {{- end }}
        {{- if .Values.zfs.holdCsiSnapshots }}
        - alert: ScaleCSISnapshotHoldFailed
          # holdCsiSnapshots is on, so the operator has asked for deletion-proof
          # snapshots; a hold error means a VolumeSnapshot became ReadyToUse
          # UNPROTECTED, silently degrading to pre-GF2 behavior.
          expr: increase(scale_csi_snapshot_holds_total{operation="hold",status="error"}[1h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI could not place a snapshot hold
            description: A CSI VolumeSnapshot was created without the deletion-proof ZFS hold zfs.holdCsiSnapshots asks for; foreign actors can destroy it.
            runbook_url: docs/troubleshooting.md#snapshots
        {{- end }}
        {{- if .Values.zfs.promoteRestoredClones }}
        - alert: ScaleCSIClonePromoteRefused
          # Promote is opt-in and always retryable, so ONE refusal is noise. A
          # refusal every pass for an hour is a clone whose origin pin is never
          # released, which keeps its source snapshot unreclaimable forever.
          expr: increase(scale_csi_clone_promotes_refused_total[1h]) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Scale CSI keeps refusing to promote a restored clone
            description: An eligibility gate has refused the same clone promotion for an hour; the clone's origin-snapshot pin is not being released. The reason label names the gate.
            runbook_url: docs/troubleshooting.md#clean-up-orphaned-truenas-resources
        {{- end }}
        {{- if .Values.backendHealth.enabled }}
        - alert: ScaleCSIPoolDegraded
          # DEGRADED/FAULTED/UNAVAIL only. OFFLINE/REMOVED are excluded: an
          # offline spare or a removed cache device does not put the data path at
          # risk. This is the SAME severity split the per-PVC VolumeCondition
          # applies: the two agree on WHICH states are abnormal. They are not the
          # same signal in TIME — this alert reads the RAW gauge, the condition is
          # debounced by two-sample hysteresis, THIS RULE ADDS ITS OWN 5m `for`
          # hold on top, and Prometheus observes all of it on its own scrape and
          # rule-evaluation cadence — so do not claim they always agree. There are
          # SEVEN NUMBERED classes of divergence:
          #   1. confirmation lag (BOUNDED: one interval plus one 30s call
          #      timeout, <= 2m30s at the interval ceiling — and that bounds
          #      DRIVER-SIDE PUBLICATION only, not the PVC object or this alert);
          #   2. alert hold (BOUNDED by the 5m `for` below — after the condition
          #      confirms, PVCs read Abnormal while this alert is still PENDING,
          #      and BOTH diagnostic gauges read 0);
          #   3. recovery (BOUNDED, one sample);
          #   4. poll stall (UNBOUNDED: it lasts until a successful USABLE sample
          #      arrives — a `pool ... not found` reply is still a failed sample);
          #   5. observer lag (UNBOUNDED: scrape and rule-evaluation cadence,
          #      which the driver does not control — `for` starts at the first
          #      true EVALUATION, not at the driver's sample, so after a recovery
          #      both diagnostic gauges can read 0 while this alert still fires);
          #   6. cold start (UNBOUNDED: before the first successful sample of a
          #      controller process the raw series do not exist, so THIS ALERT
          #      CANNOT FIRE — scale_csi_pool_health_stale is the only signal,
          #      and it cannot tell a missing pool from an unreachable one);
          #   7. replica skew (UNBOUNDED: the poller has no leader-election gate,
          #      so every replica — and, with fencing.mode=off, an overlapping
          #      rollout — publishes its own sampled history, which the `max by
          #      (pool)` below merges. Helm rejects replicas > 1 when this poller
          #      is enabled and maxSurge 0 removes rollout surge, but Deployment
          #      termination/drain/eviction overlap remains inherent and is
          #      detected, not prevented, by ScaleCSIPoolHealthProducerSkew).
          # See docs/production.md#backend-health; the canonical list lives on
          # backendHealthFlipSamples in pkg/driver/backend_health.go.
          expr: max(scale_csi_pool_status{status=~"DEGRADED|FAULTED|UNAVAIL"}) by (pool) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Scale CSI backend pool is degraded
            description: The ZFS pool backing every Scale CSI volume reports a degraded, faulted or unavailable state. The DRIVER publishes the abnormal VolumeCondition once the two-sample hysteresis confirms the transition (at most 2 x the effective clamped backendHealth.interval PLUS one 30s backend call timeout, so at most 4m30s, while successful samples keep arriving). That is a DRIVER-SIDE PUBLICATION bound only - it is NOT a deadline for the PVC object - the CSI read, the external-health-monitor refresh cadence, the Prometheus scrape and rule evaluation are all downstream of it and none of them is bounded by this chart. Check scale_csi_pool_health_flip_pending and scale_csi_pool_health_stale before concluding the condition is wrong - while flip_pending is 1 and the snapshot is still inside its staleness TTL the condition deliberately carries the previous verdict; past the TTL conditions fall back to dataset-only even though flip_pending may still read 1. Both gauges reading 0 does NOT prove a remaining mismatch is a defect - this alert changes state on Prometheus scrape and rule-evaluation cadence, not at the driver's sample time, so a confirmed recovery can leave both gauges at 0 while this alert is still firing. Compare the driver-owned scale_csi_pool_health_last_success_timestamp_seconds against scrape freshness, and check count by (pool) on that same series for more than one producer, before comparing anything - see docs/production.md, Signal timing.
        - alert: ScaleCSIPoolScanErrors
          expr: max(scale_csi_pool_scan_errors) by (pool) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI backend pool scrub reported errors
            description: The pool's most recent scrub or resilver reported unrecovered errors.
        - alert: ScaleCSIPoolDiskTemperatureAlert
          expr: max(scale_csi_pool_disk_temp_alerts) by (pool) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI backend pool has a disk temperature alert
            description: At least one member disk of the pool backing Scale CSI volumes is raising a temperature alert. The VALUE counts member disks that have at least one temperature alert (several alerts on one disk count once), plus any alert whose disk the appliance did not identify - those are counted individually because there is nothing to deduplicate them on. Interpret the count with scale_csi_pool_disk_temp_alerts_age_seconds; the age is absent until disk.temperature_alerts has returned successfully and is the component's actual observation age thereafter.
        - alert: ScaleCSIPoolHealthStale
          # Fires when the served VolumeCondition is no longer backed by a fresh
          # sample, and is the reason to distrust every other scale_csi_pool_*
          # series. "The backend stopped answering" is only ONE of the causes and
          # naming it alone is misleading: the snapshot aged past the staleness
          # TTL (conditions silently fall back to the dataset-only signal), a held
          # transition never got its confirming sample, this controller process
          # has not had a first successful sample yet (cold start), or the backend
          # ANSWERED and the reply did not list the pool at all — a missing,
          # renamed or misspelled pool. The label is the CONFIGURED pool name and
          # nothing has verified it against the appliance, so this series cannot
          # distinguish a nonexistent pool from an unreachable existing one. Read
          # it as "no fresh sample for this configured identity".
          expr: max(scale_csi_pool_health_stale) by (pool) == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI backend health data is stale
            description: The controller has not obtained a fresh pool.query sample for the CONFIGURED pool name. The VolumeCondition being served is not backed by a current sample - the snapshot aged past its TTL (3 x the EFFECTIVE clamped backendHealth.interval, so 3m at the default and never more than 6m) and conditions fell back to dataset-only, a held health transition never received its confirming sample, or no successful sample has landed since this controller process started. This does NOT say the pool is unhealthy, or that it exists - a misspelled, renamed or deleted pool produces this identical series, because pool.query answering without listing the pool is a failed sample. Check zfs.parentDataset against the appliance before assuming an outage. The other scale_csi_pool_* gauges are frozen at their last values, so a frozen DEGRADED keeps ScaleCSIPoolDegraded firing until a successful sample changes it - that alert is deliberately NOT gated on this one. At cold start those gauges do not exist at all and ScaleCSIPoolDegraded cannot fire, which is why this alert is the only signal there. This is the poll-stall/cold-start pair and both are UNBOUNDED - they last until a successful USABLE sample arrives, and a pool.query reply that does not list the pool is not one.
        - alert: ScaleCSIPoolConditionFlipPending
          # The debounce is stuck. Normally a held transition confirms or clears on
          # the very next sample, so this is 1 for at most one interval plus one
          # 30s call timeout (<= 2m30s). Staying pending means the confirming
          # sample is not arriving: the poll-stall class, which is UNBOUNDED (it
          # lasts until a successful USABLE sample arrives). Note this gauge is NOT
          # a complete raw-vs-condition disagreement detector - it reads 0 during
          # the alert-hold, observer-lag and cold-start classes, and past the
          # staleness TTL it can still read 1 after conditions have fallen back to
          # dataset-only.
          expr: max(scale_csi_pool_health_flip_pending) by (pool) == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Scale CSI pool health transition is stuck awaiting confirmation
            description: A pool-health transition has been held for confirmation far longer than one poll interval, so while the held snapshot is still inside its staleness TTL every managed PVC reports the PREVIOUS VolumeCondition while the raw scale_csi_pool_* gauges show the new state. Past that TTL conditions fall back to dataset-only and this gauge can still read 1 until the next successful sample clears it. Check controller logs and TrueNAS reachability - the confirming pool.query sample is not arriving.
        - alert: ScaleCSIPoolHealthProducerSkew
          # Divergence class 7 (replica skew) made detectable instead of inferred.
          # The backend-health poller has NO leader-election gate: every
          # controller replica runs it, and with fencing.mode=off an overlapping
          # RollingUpdate can run two processes at once. Each publishes its own
          # independently sampled series, which every `max by (pool)` rule above
          # merges into one history - so two synchronized reads can disagree with
          # perfect scrape and rule timing, and `max` keeps the worst of them.
          # This counts PRODUCERS, using the driver-owned last-success timestamp
          # (one series per controller process). The 15m hold is longer than any
          # normal rollout, so this fires on a STANDING second producer -
          # replicas > 1 - rather than on a routine restart.
          expr: count by (pool) (scale_csi_pool_health_last_success_timestamp_seconds) > 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: More than one Scale CSI controller is publishing backend health
            description: Two or more controller processes are publishing scale_csi_pool_* series for the same pool, so every max by (pool) rule is merging independently sampled histories and the per-PVC VolumeCondition comes from whichever process the external health monitor is elected in. This is the replica-skew class - a producer-identity difference, not a timing one, and nothing in the driver bounds it. The supported single-producer configuration for backendHealth is controller.replicas=1 and Helm rejects a larger value; maxSurge 0 removes rollout surge, but Deployment termination, drain and eviction can still overlap producers. This alert detects that residual, it does not fence it. Until this clears, pin one pod label before comparing gauges, conditions and alerts.
        {{- end }}
        {{- end }}
{{- end }}
