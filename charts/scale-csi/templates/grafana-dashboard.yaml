{{- if .Values.metrics.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scale-csi.fullname" . }}-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scale-csi.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  {{- with .Values.metrics.dashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  scale-csi.json: |-
    {
      "annotations":{"list":[{"builtIn":1,"datasource":{"type":"grafana","uid":"-- Grafana --"},"enable":true,"hide":true,"iconColor":"rgba(0, 211, 255, 1)","name":"Annotations & Alerts","type":"dashboard"}]},
      "description":"scale-csi driver for TrueNAS SCALE — health, CSI operations, TrueNAS API, node transports and multipath, reconcile/reaper, snapshots and clones, fencing, and capacity",
      "editable":true,
      "graphTooltip":1,
      "panels":[
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":0},"id":100,"panels":[],"title":"At a Glance","type":"row"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"Controller WebSocket API connectivity to TrueNAS","fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"mappings":[{"options":{"0":{"color":"red","index":0,"text":"DOWN"},"1":{"color":"green","index":1,"text":"OK"}},"type":"value"}],"thresholds":{"mode":"absolute","steps":[{"color":"red"},{"color":"green","value":1}]},"unit":"short"},"overrides":[]},"gridPos":{"h":5,"w":3,"x":0,"y":1},"id":1,"options":{"colorMode":"background","graphMode":"none","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"max(scale_csi_truenas_connection_status{job=\"{{ include "scale-csi.fullname" . }}-controller-metrics\"})","refId":"A"}],"title":"TrueNAS Connection","type":"stat"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"TrueNAS API circuit breaker state reported by the controller","fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"mappings":[{"options":{"0":{"color":"green","index":0,"text":"CLOSED"},"1":{"color":"red","index":1,"text":"OPEN"},"2":{"color":"yellow","index":2,"text":"HALF-OPEN"}},"type":"value"}],"thresholds":{"mode":"absolute","steps":[{"color":"green"},{"color":"red","value":1}]},"unit":"short"},"overrides":[]},"gridPos":{"h":5,"w":3,"x":3,"y":1},"id":2,"options":{"colorMode":"background","graphMode":"none","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"max(scale_csi_circuit_breaker_state{job=\"{{ include "scale-csi.fullname" . }}-controller-metrics\"})","refId":"A"}],"title":"Circuit Breaker","type":"stat"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"1 when a pooled connection holds a live core.get_jobs subscription; 0 = pure-poll fallback (higher API load + latency)","fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"mappings":[{"options":{"0":{"color":"red","index":0,"text":"PURE-POLL"},"1":{"color":"green","index":1,"text":"SUBSCRIBED"}},"type":"value"}],"thresholds":{"mode":"absolute","steps":[{"color":"red"},{"color":"green","value":1}]},"unit":"short"},"overrides":[]},"gridPos":{"h":5,"w":3,"x":6,"y":1},"id":28,"options":{"colorMode":"background","graphMode":"none","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"min(scale_csi_job_dispatcher_subscribed{job=\"{{ include "scale-csi.fullname" . }}-controller-metrics\"})","refId":"A"}],"title":"Job Dispatcher Subscribed","type":"stat"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"TrueNAS volumes with no matching live Kubernetes PV handle","fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"mappings":[],"thresholds":{"mode":"absolute","steps":[{"color":"green"},{"color":"orange","value":1}]},"unit":"short"},"overrides":[]},"gridPos":{"h":5,"w":3,"x":9,"y":1},"id":3,"options":{"colorMode":"background","graphMode":"none","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"max(scale_csi_orphan_volumes{job=\"{{ include "scale-csi.fullname" . }}-controller-metrics\"}) or vector(0)","refId":"A"}],"title":"Orphan Volumes","type":"stat"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"TrueNAS snapshots with no matching live VolumeSnapshotContent handle","fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"mappings":[],"thresholds":{"mode":"absolute","steps":[{"color":"green"},{"color":"orange","value":1}]},"unit":"short"},"overrides":[]},"gridPos":{"h":5,"w":3,"x":12,"y":1},"id":4,"options":{"colorMode":"background","graphMode":"none","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"max(scale_csi_orphan_snapshots{job=\"{{ include "scale-csi.fullname" . }}-controller-metrics\"}) or vector(0)","refId":"A"}],"title":"Orphan Snapshots","type":"stat"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"VolSync restore leftovers awaiting garbage collection","fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"mappings":[],"thresholds":{"mode":"absolute","steps":[{"color":"green"},{"color":"orange","value":1}]},"unit":"short"},"overrides":[]},"gridPos":{"h":5,"w":3,"x":15,"y":1},"id":5,"options":{"colorMode":"background","graphMode":"none","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"max(scale_csi_spent_restore_snapshots{job=\"{{ include "scale-csi.fullname" . }}-controller-metrics\"}) or vector(0)","refId":"A"}],"title":"Spent Restore Snaps","type":"stat"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"PVCs using any StorageClass provisioned by this scale-csi driver","fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"mappings":[],"thresholds":{"mode":"absolute","steps":[{"color":"green"}]},"unit":"short"},"overrides":[]},"gridPos":{"h":5,"w":3,"x":18,"y":1},"id":6,"options":{"colorMode":"background","graphMode":"none","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"count(kube_persistentvolumeclaim_info * on (storageclass) group_left() kube_storageclass_info{provisioner=\"{{ include "scale-csi.driverName" . }}\"})","refId":"A"}],"title":"scale-csi PVCs","type":"stat"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"Operations currently in a continuous FailedPrecondition retry window (30m). The CSI error panel deliberately excludes this code as benign; a SUSTAINED loop is a wedged CO retry (2026-08-19 incident class: a tombstone-blocked DeleteVolume). Pairs with the ScaleCSIOperationFailedPreconditionStuck alert.","fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"mappings":[],"thresholds":{"mode":"absolute","steps":[{"color":"green"},{"color":"orange","value":1}]},"unit":"short"},"overrides":[]},"id":40,"options":{"colorMode":"background","graphMode":"none","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"count(sum by (operation) (rate(scale_csi_operations_total{job=\"{{ include "scale-csi.fullname" . }}-controller-metrics\",status=\"error\",code=\"FailedPrecondition\"}[30m])) > 0) or vector(0)","refId":"A"}],"title":"FailedPrecondition Loops","type":"stat","gridPos":{"h":5,"w":3,"x":21,"y":1}},
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":6},"id":101,"panels":[],"title":"CSI Operations","type":"row"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"CSI RPC rate by operation","fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":1,"pointSize":5,"showPoints":"never","spanNulls":false,"stacking":{"group":"A","mode":"none"}},"mappings":[],"unit":"ops"},"overrides":[]},"gridPos":{"h":9,"w":12,"x":0,"y":7},"id":10,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"sum by (operation) (rate(scale_csi_operations_total[$__rate_interval])) > 0","legendFormat":"{{`{{operation}}`}}","refId":"A"}],"title":"CSI Operations Rate","type":"timeseries"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"CSI RPC latency percentiles by operation","fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":1,"pointSize":5,"showPoints":"never","spanNulls":false,"stacking":{"group":"A","mode":"none"}},"mappings":[],"unit":"s"},"overrides":[]},"gridPos":{"h":9,"w":12,"x":12,"y":7},"id":11,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"histogram_quantile(0.50, sum by (operation, le) (rate(scale_csi_operations_duration_seconds_bucket[$__rate_interval]))) > 0","legendFormat":"{{`{{operation}}`}} p50","refId":"A"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"histogram_quantile(0.95, sum by (operation, le) (rate(scale_csi_operations_duration_seconds_bucket[$__rate_interval]))) > 0","legendFormat":"{{`{{operation}}`}} p95","refId":"B"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"histogram_quantile(0.99, sum by (operation, le) (rate(scale_csi_operations_duration_seconds_bucket[$__rate_interval]))) > 0","legendFormat":"{{`{{operation}}`}} p99","refId":"C"}],"title":"CSI Operation Latency (p50 / p95 / p99)","type":"timeseries"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"Error rate excluding benign retry and idempotency codes","fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":1,"pointSize":5,"showPoints":"never","spanNulls":false,"stacking":{"group":"A","mode":"none"}},"mappings":[],"unit":"ops"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":16},"id":12,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"sum by (operation, code) (rate(scale_csi_operations_total{status=\"error\",code!~\"Aborted|NotFound|AlreadyExists\"}[$__rate_interval]))","legendFormat":"{{`{{operation}}`}} {{`{{code}}`}}","refId":"A"}],"title":"CSI Operation Errors","type":"timeseries"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"Per-operation FailedPrecondition rate over 30m windows — the exact signal behind the ScaleCSIOperationFailedPreconditionStuck alert. Short blips are benign races (delete vs detach); a flat nonzero line is a wedged retry loop. Runbook: docs/troubleshooting.md#tombstone-blocked-deletevolume.","fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":1,"pointSize":5,"showPoints":"never","spanNulls":false,"stacking":{"group":"A","mode":"none"}},"mappings":[],"unit":"ops"},"overrides":[]},"id":41,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"sum by (operation) (rate(scale_csi_operations_total{job=\"{{ include "scale-csi.fullname" . }}-controller-metrics\",status=\"error\",code=\"FailedPrecondition\"}[30m]))","legendFormat":"{{`{{operation}}`}}","refId":"A"}],"title":"FailedPrecondition Retry Loops","type":"timeseries","gridPos":{"h":8,"w":12,"x":12,"y":16}},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"99th-percentile publish latency derived from the operations histogram","fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":1,"pointSize":5,"showPoints":"never","spanNulls":false,"stacking":{"group":"A","mode":"none"}},"mappings":[],"unit":"s"},"overrides":[]},"gridPos":{"h":8,"w":24,"x":0,"y":24},"id":21,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"histogram_quantile(0.99, sum by (operation, le) (rate(scale_csi_operations_duration_seconds_bucket{operation=~\".*PublishVolume\"}[$__rate_interval]))) > 0","legendFormat":"{{`{{operation}}`}} p99","refId":"A"}],"title":"Publish Latency p99","type":"timeseries"},
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":32},"id":102,"panels":[],"title":"TrueNAS API","type":"row"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"TrueNAS WebSocket API call rate by method","fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":1,"pointSize":5,"showPoints":"never","spanNulls":false,"stacking":{"group":"A","mode":"none"}},"mappings":[],"unit":"reqps"},"overrides":[]},"gridPos":{"h":9,"w":12,"x":0,"y":33},"id":13,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"topk(10, sum by (method) (rate(scale_csi_truenas_requests_total[$__rate_interval]))) > 0","legendFormat":"{{`{{method}}`}}","refId":"A"}],"title":"TrueNAS API Request Rate (top 10)","type":"timeseries"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"TrueNAS API request rate stacked by honest outcome (E1): benign idempotent results separate from real errors","fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":1,"pointSize":5,"showPoints":"never","spanNulls":false,"stacking":{"group":"A","mode":"normal"}},"mappings":[],"unit":"reqps"},"overrides":[]},"gridPos":{"h":9,"w":12,"x":12,"y":33},"id":20,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"sum by (status) (rate(scale_csi_truenas_requests_total[$__rate_interval]))","legendFormat":"{{`{{status}}`}}","refId":"A"}],"title":"TrueNAS API Outcomes","type":"timeseries"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"WebSocket API round-trip latency. pool.dataset.* mutations scale with the NAS's TOTAL dataset count (middleware, not ZFS — see docs/production.md backend scaling envelope), so a slow drift here usually tracks dataset growth on the appliance.","fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":1,"pointSize":5,"showPoints":"never","spanNulls":false,"stacking":{"group":"A","mode":"none"}},"mappings":[],"unit":"s"},"overrides":[]},"id":42,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"histogram_quantile(0.50, sum by (le) (rate(scale_csi_truenas_requests_duration_seconds_bucket[$__rate_interval])))","legendFormat":"p50","refId":"A"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"histogram_quantile(0.95, sum by (le) (rate(scale_csi_truenas_requests_duration_seconds_bucket[$__rate_interval])))","legendFormat":"p95","refId":"B"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"histogram_quantile(0.99, sum by (le) (rate(scale_csi_truenas_requests_duration_seconds_bucket[$__rate_interval])))","legendFormat":"p99","refId":"C"}],"title":"TrueNAS API Latency (p50 / p95 / p99)","type":"timeseries","gridPos":{"h":8,"w":12,"x":0,"y":42}},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"Fraction of TrueNAS API requests returning errors","fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":1,"pointSize":5,"showPoints":"never","spanNulls":false,"stacking":{"group":"A","mode":"none"}},"mappings":[],"unit":"percentunit"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":42},"id":14,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"sum(rate(scale_csi_truenas_requests_total{status=\"error\"}[$__rate_interval])) / sum(rate(scale_csi_truenas_requests_total[$__rate_interval]))","legendFormat":"error rate","refId":"A"}],"title":"TrueNAS API Error Rate","type":"timeseries"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"In-flight calls waiting on the connection pool vs active WebSocket connections. Pending climbing while connections are flat means the appliance is the bottleneck, not the pool size.","fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":1,"pointSize":5,"showPoints":"never","spanNulls":false,"stacking":{"group":"A","mode":"none"}},"mappings":[],"unit":"short"},"overrides":[]},"id":43,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"max(scale_csi_truenas_pending_calls{job=\"{{ include "scale-csi.fullname" . }}-controller-metrics\"})","legendFormat":"pending calls","refId":"A"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"max(scale_csi_truenas_connections_active{job=\"{{ include "scale-csi.fullname" . }}-controller-metrics\"})","legendFormat":"active connections","refId":"B"}],"title":"TrueNAS API Backpressure","type":"timeseries","gridPos":{"h":8,"w":12,"x":0,"y":50}},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"Circuit breaker open events and current consecutive failures","fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":1,"pointSize":5,"showPoints":"never","spanNulls":false,"stacking":{"group":"A","mode":"none"}},"mappings":[],"unit":"short"},"overrides":[{"matcher":{"id":"byRegexp","options":"^opens"},"properties":[{"id":"unit","value":"ops"}]}]},"gridPos":{"h":8,"w":12,"x":12,"y":50},"id":30,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"sum(rate(scale_csi_circuit_breaker_opens_total{job=\"{{ include "scale-csi.fullname" . }}-controller-metrics\"}[$__rate_interval]))","legendFormat":"opens/s","refId":"A"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"max(scale_csi_circuit_breaker_current_failures{job=\"{{ include "scale-csi.fullname" . }}-controller-metrics\"})","legendFormat":"current failures","refId":"B"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"sum(rate(scale_csi_circuit_breaker_failures_total[$__rate_interval]))","legendFormat":"failures/s","refId":"C"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"sum(rate(scale_csi_circuit_breaker_successes_total[$__rate_interval]))","legendFormat":"successes/s","refId":"D"}],"title":"Circuit Breaker Detail","type":"timeseries"},
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":58},"id":103,"panels":[],"title":"Node Transports & Multipath","type":"row"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"Live iSCSI and NVMe-oF sessions per node plugin","fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":1,"pointSize":5,"showPoints":"never","spanNulls":false,"stacking":{"group":"A","mode":"none"}},"mappings":[],"unit":"short"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":59},"id":15,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"sum by (pod) (scale_csi_iscsi_sessions_total)","legendFormat":"iSCSI {{`{{pod}}`}}","refId":"A"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"sum by (pod) (scale_csi_nvme_sessions_total)","legendFormat":"NVMe {{`{{pod}}`}}","refId":"B"}],"title":"Block Sessions by Node","type":"timeseries"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"Node transport connection attempts and garbage-collected orphan sessions","fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":1,"pointSize":5,"showPoints":"never","spanNulls":false,"stacking":{"group":"A","mode":"none"}},"mappings":[],"unit":"ops"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":59},"id":16,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"sum by (transport, result) (rate(scale_csi_node_connect_total[$__rate_interval]))","legendFormat":"connect {{`{{transport}}`}} {{`{{result}}`}}","refId":"A"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"sum by (transport) (rate(scale_csi_gc_sessions_disconnected_total[$__rate_interval]))","legendFormat":"GC disconnect {{`{{transport}}`}}","refId":"B"}],"title":"Node Connects / GC Disconnects","type":"timeseries"},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"Per-portal iSCSI login outcomes (GF-6). Series exist only with iscsi.multipath enabled; sustained failures on one portal = a degraded path serving I/O on the remaining ones.","fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":1,"pointSize":5,"showPoints":"never","spanNulls":false,"stacking":{"group":"A","mode":"none"}},"mappings":[],"unit":"ops"},"overrides":[]},"id":44,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"sum by (portal, result) (rate(scale_csi_iscsi_path_connect_total[$__rate_interval]))","legendFormat":"{{`{{portal}}`}} {{`{{result}}`}}","refId":"A"}],"title":"iSCSI Multipath Connects","type":"timeseries","gridPos":{"h":8,"w":8,"x":0,"y":67}},
        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"Per-address NVMe-oF connect outcomes. Series exist only with NVMe multipath hints published; sustained failures on one address = a degraded path.","fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":1,"pointSize":5,"showPoints":"never","spanNulls":false,"stacking":{"group":"A","mode":"none"}},"mappings":[],"unit":"ops"},"overrides":[]},"id":45,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"sum by (address, result) (rate(scale_csi_nvme_path_connect_total[$__rate_interval]))","legendFormat":"{{`{{address}}`}} {{`{{result}}`}}","refId":"A"}],"title":"NVMe-oF Path Connects","type":"timeseries","gridPos":{"h":8,"w":8,"x":8,"y":67}},
