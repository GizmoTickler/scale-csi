        {"datasource":{"type":"prometheus","uid":"$datasource"},"description":"Backend pool health published when backendHealth.enabled. ZFS has no per-dataset health: this per-POOL signal is what the driver fans out onto every managed PVC's VolumeCondition. A running scrub/resilver is normal maintenance, not ill health. These are the RAW samples; the per-PVC VolumeCondition is debounced by two-sample hysteresis, so while 'flip pending' is 1 and the held snapshot is still inside its staleness TTL the PVCs deliberately still report the PREVIOUS verdict. Past that TTL conditions fall back to dataset-only even if these flags still read 1. Neither flag is raised during the alert-hold class (condition already abnormal, ScaleCSIPoolDegraded still pending), the observer-lag class (Prometheus scrapes and evaluates on its own cadence, so both flags can read 0 while an alert still fires) or the replica-skew class (more than one controller publishing). Cold start is different: the raw pool series do not exist at all there, but 'health stale' IS raised - it is published as 1 (with flip pending 0) precisely so the blind window is not silent, and it cannot tell a missing or renamed pool from an unreachable one. The disk temperature count is a follow-up component: use scale_csi_pool_disk_temp_alerts_age_seconds to see its actual age; an absent age means no successful follow-up has returned yet. Use the driver-owned scale_csi_pool_health_last_success_timestamp_seconds for pool sample age - PromQL timestamp() would return the scrape time - and count by (pool) on it to spot a second producer. Seven divergence classes, the last four unbounded - the canonical numbered list is backendHealthFlipSamples in pkg/driver/backend_health.go; see docs/production.md, Signal timing.","fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":1,"pointSize":5,"showPoints":"never","spanNulls":false,"stacking":{"group":"A","mode":"none"}},"mappings":[],"unit":"short"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":119},"id":32,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"max by (pool) (scale_csi_pool_healthy)","legendFormat":"healthy {{`{{pool}}`}}","refId":"A"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"max by (pool) (scale_csi_pool_status{status=~\"DEGRADED|FAULTED|UNAVAIL\"})","legendFormat":"degraded {{`{{pool}}`}}","refId":"B"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"max by (pool, function) (scale_csi_pool_scan_state{state=\"SCANNING\"})","legendFormat":"scanning {{`{{pool}}`}} {{`{{function}}`}}","refId":"C"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"max by (pool) (scale_csi_pool_scan_errors)","legendFormat":"scan errors {{`{{pool}}`}}","refId":"D"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"max by (pool) (scale_csi_pool_disk_temp_alerts)","legendFormat":"disk temp alerts {{`{{pool}}`}}","refId":"E"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"max by (pool) (scale_csi_pool_disk_temp_alerts_age_seconds)","legendFormat":"disk temp sample age {{`{{pool}}`}}","refId":"F"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"max by (pool) (scale_csi_pool_health_flip_pending)","legendFormat":"condition flip pending {{`{{pool}}`}}","refId":"G"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"max by (pool) (scale_csi_pool_health_stale)","legendFormat":"health stale {{`{{pool}}`}}","refId":"H"},{"datasource":{"type":"prometheus","uid":"$datasource"},"expr":"count by (pool) (scale_csi_pool_health_last_success_timestamp_seconds)","legendFormat":"publishing controllers {{`{{pool}}`}}","refId":"I"}],"title":"Backend Pool Health","type":"timeseries"},
