{{- if and .Values.controller.enabled (ne .Values.fencing.mode "off") (ne (int .Values.controller.replicas) 1) -}}
{{- fail "fencing.mode additive/strict requires controller.replicas=1 because background fencing reconcilers are singleton writers" -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scale-csi.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scale-csi.labels" . | nindent 4 }}
data:
  config.yaml: |
    # CSI Driver configuration
    driver: {{ .Values.csiDriverName }}
    {{ with .Values.driverInstanceId }}
    driverInstanceId: {{ . | quote }}
    {{ end }}

    fencing:
      mode: {{ .Values.fencing.mode | quote }}
      startupReconcileTimeout: {{ .Values.fencing.startupReconcileTimeout | quote }}
      staleRecordGracePeriod: {{ .Values.fencing.staleRecordGracePeriod | quote }}

    # TrueNAS connection settings
    truenas:
      host: {{ .Values.truenas.host | quote }}
      port: {{ .Values.truenas.port }}
      protocol: {{ if .Values.truenas.secure }}https{{ else }}http{{ end }}
      apiKey: $TRUENAS_API_KEY
      allowInsecure: {{ .Values.truenas.skipTLSVerify }}
      caCert: {{ .Values.truenas.caCert | quote }}
      caCertFile: {{ .Values.truenas.caCertFile | quote }}
      requestTimeout: {{ .Values.truenas.requestTimeout | default 60 }}
      connectTimeout: {{ .Values.truenas.connectTimeout }}
      writeTimeout: {{ .Values.truenas.writeTimeout | default 30 }}
      maxConcurrentRequests: {{ .Values.truenas.maxConcurrentRequests | default 10 }}
      {{- if not (kindIs "invalid" .Values.truenas.maxConnections) }}
      maxConnections: {{ .Values.truenas.maxConnections }}
      {{- end }}

    # ZFS dataset configuration
    zfs:
      datasetParentName: {{ .Values.zfs.parentDataset | quote }}
      datasetEnableQuotas: {{ .Values.zfs.enforceQuota }}
      datasetEnableReservation: false
      detachedVolumesFromSnapshots: {{ .Values.zfs.detachedVolumesFromSnapshots }}
      {{- with .Values.zfs.datasetProperties }}
      datasetProperties:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      zvolBlocksize: {{ .Values.zfs.zvolBlocksize | quote }}
      zvolEnableReservation: {{ .Values.zfs.zvolEnableReservation }}
      zvolReadyTimeout: {{ .Values.zfs.zvolReadyTimeout | default 60 }}
      destroyForeignSnapshotsOnDelete: {{ .Values.zfs.destroyForeignSnapshotsOnDelete }}

    {{- if .Values.nfs.enabled }}
    # NFS configuration
    nfs:
      enabled: true
      shareHost: {{ .Values.nfs.server | default .Values.truenas.host | quote }}
      shareAllowedNetworks:
        {{- toYaml .Values.nfs.shareAllowedNetworks | nindent 8 }}
      shareAllowedHosts: []
      shareMaprootUser: {{ .Values.nfs.shareMaprootUser | quote }}
      shareMaprootGroup: {{ .Values.nfs.shareMaprootGroup | quote }}
      shareMapallUser: {{ .Values.nfs.shareMapallUser | quote }}
      shareMapallGroup: {{ .Values.nfs.shareMapallGroup | quote }}
      {{- /* Every GF5 NFS key renders ONLY when it is non-default, so the
           default ConfigMap is byte-identical to the pre-GF5 render and stays
           parseable by a rolled-back binary that has no such field. */}}
      {{- with .Values.nfs.shareSecurity }}
      shareSecurity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.nfs.shareExposeSnapshots }}
      shareExposeSnapshots: true
      {{- end }}
      {{- if .Values.nfs.krbEnabled }}
      krbEnabled: true
      {{- end }}
      {{- if .Values.nfs.versionPreflight }}
      versionPreflight: true
      {{- end }}
      {{- with .Values.nfs.ensureProtocols }}
      # HARD RULE: mutates the GLOBAL TrueNAS NFS service (all exports).
      ensureProtocols:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}

    {{- if .Values.iscsi.enabled }}
    # iSCSI configuration
    iscsi:
      enabled: true
      {{- $portal := .Values.iscsi.portal | default .Values.truenas.host }}
      {{- if not (contains ":" $portal) }}
      {{- $portal = printf "%s:%d" $portal (.Values.iscsi.portalPort | default 3260 | int) }}
      {{- end }}
      targetPortal: {{ $portal | quote }}
      interface: "default"
      {{- if .Values.iscsi.targetGroups }}
      # Static portal/initiator groups (install-specific TrueNAS database ids).
      # Fenced modes resolve the portal and create a per-volume initiator group;
      # additive mode also preserves these static groups.
      targetGroups:
        {{- toYaml .Values.iscsi.targetGroups | nindent 8 }}
      {{- end }}

      extentBlocksize: {{ .Values.iscsi.extentBlocksize }}
      extentDisablePhysicalBlocksize: {{ .Values.iscsi.extentDisablePhysicalBlocksize }}
      extentRpm: {{ .Values.iscsi.extentRpm | quote }}
      deviceWaitTimeout: {{ .Values.iscsi.deviceWaitTimeout | default 60 }}
      serviceReloadDebounce: {{ .Values.iscsi.serviceReloadDebounce | default 2000 }}
      {{- if .Values.iscsi.chap.enabled }}
      # CHAP is opt-in; this block renders only when iscsi.chap.enabled=true.
      chap:
        enabled: true
        tag: {{ .Values.iscsi.chap.tag | default 0 }}
        mutual: {{ .Values.iscsi.chap.mutual }}
      {{- end }}
    {{- end }}

    {{- if .Values.nvmeof.enabled }}
    # NVMe-oF configuration
    nvmeof:
      enabled: true
      transport: {{ .Values.nvmeof.transport | default "tcp" | quote }}
      transportAddress: {{ .Values.nvmeof.address | default .Values.truenas.host | quote }}
      transportServiceId: {{ .Values.nvmeof.port | default 4420 }}
      subsystemHosts:
        {{- toYaml .Values.nvmeof.subsystemHosts | nindent 8 }}
      subsystemAllowAnyHost: {{ .Values.nvmeof.subsystemAllowAnyHost }}
    {{- end }}

    # Session garbage collection (node plugin only)
    sessionGC:
      enabled: {{ .Values.sessionGC.enabled }}
      interval: {{ .Values.sessionGC.interval }}
      gracePeriod: {{ .Values.sessionGC.gracePeriod | default 60 }}
      dryRun: {{ .Values.sessionGC.dryRun }}
      runOnStartup: {{ .Values.sessionGC.runOnStartup }}
      startupDelay: {{ .Values.sessionGC.startupDelay }}
      iscsiEnabled: {{ .Values.sessionGC.iscsiEnabled }}
      nvmeofEnabled: {{ .Values.sessionGC.nvmeofEnabled }}

    node:
      sessionCleanupDelay: {{ .Values.node.sessionCleanupDelay }}
      maxVolumesPerNode: {{ .Values.node.maxVolumesPerNode }}

    # Controller orphan detection and separately gated cleanup.
    reconcile:
      enabled: {{ .Values.reconcile.enabled }}
      interval: {{ .Values.reconcile.interval | quote }}
      minOrphanAge: {{ .Values.reconcile.minOrphanAge | quote }}
      spentRestore:
        enabled: {{ .Values.reconcile.spentRestore.enabled }}
      bookkeeping:
        enabled: {{ .Values.reconcile.bookkeeping.enabled }}
        cleanupParent: {{ .Values.reconcile.bookkeeping.cleanupParent }}
      tombstoneReaper:
        scanFallback:
          enabled: {{ .Values.reconcile.tombstoneReaper.scanFallback.enabled }}
      delete:
        enabled: {{ .Values.reconcile.delete.enabled }}
        schedule: {{ .Values.reconcile.delete.schedule | quote }}
        maxPerRun: {{ .Values.reconcile.delete.maxPerRun }}

    {{- if or .Values.capacity.reportMaximumVolumeSize .Values.capacity.gaugeEnabled }}
    # Capacity reporting / pool-capacity gauges (opt-in). The block renders ONLY
    # when a capacity value is non-default so the default ConfigMap carries no
    # capacity: key and stays parseable by a rolled-back binary with no capacity
    # field (F1 invariant); the driver default (off) is the source of truth when
    # the block is absent.
    capacity:
      {{- if .Values.capacity.reportMaximumVolumeSize }}
      reportMaximumVolumeSize: {{ .Values.capacity.reportMaximumVolumeSize }}
      {{- end }}
      {{- if .Values.capacity.gaugeEnabled }}
      gaugeEnabled: true
      gaugeInterval: {{ .Values.capacity.gaugeInterval | default "60s" | quote }}
      {{- end }}
    {{- end }}

    resilience:
      circuitBreaker:
        enabled: {{ .Values.resilience.circuitBreaker.enabled }}
        failureThreshold: {{ .Values.resilience.circuitBreaker.failureThreshold }}
        timeout: {{ .Values.resilience.circuitBreaker.timeout }}
      retry:
        maxAttempts: {{ .Values.resilience.retry.maxAttempts }}
        initialDelay: {{ .Values.resilience.retry.initialDelay }}
        maxDelay: {{ .Values.resilience.retry.maxDelay }}
        backoffMultiplier: {{ .Values.resilience.retry.backoffMultiplier }}
      rateLimiting:
        maxConcurrentLogins: {{ .Values.resilience.rateLimiting.maxConcurrentLogins }}

    commandTimeouts:
      mount: {{ .Values.commandTimeouts.mount }}
      format: {{ .Values.commandTimeouts.format }}
      iscsi: {{ .Values.commandTimeouts.iscsi }}
      nvme: {{ .Values.commandTimeouts.nvme }}
