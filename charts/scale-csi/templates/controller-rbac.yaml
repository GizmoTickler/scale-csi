{{- if and .Values.serviceAccount.create .Values.controller.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "scale-csi.controllerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scale-csi.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.rbac.create .Values.controller.enabled }}
{{- if .Values.serviceAccount.create }}
---
{{- end }}
{{- /* (C10) Cluster-wide get on ALL Secrets is dead privilege unless an
ENABLED StorageClass actually declares a CHAP or encryption secret ref
(chapSecretName / encryptionSecretName) — every bundled example that would
need one ships disabled by default. This is mounted into five upstream
sidecar containers and is the one authorized to destroy backend objects, so
gate the rule instead of granting it unconditionally (note: .kube-linter.yaml
excludes access-to-secrets, so no linter catches this either). */}}
{{- $secretRefStorageClassCount := 0 -}}
{{- range .Values.storageClasses }}
{{- if or (not (hasKey . "enabled")) .enabled }}
{{- if or .chapSecretName .encryptionSecretName }}
{{- $secretRefStorageClassCount = add $secretRefStorageClassCount 1 -}}
{{- end }}
{{- end }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "scale-csi.fullname" . }}-controller
  labels:
    {{- include "scale-csi.labels" . | nindent 4 }}
rules:
  # Provisioner permissions
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  {{- if gt $secretRefStorageClassCount 0 }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- end }}
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments/status"]
    verbs: ["patch"]
  # VolumeAttributesClass (storage.k8s.io/v1). Unconditional, not sidecar-gated:
  # the driver implements ControllerModifyVolume (v1.9.0), and csi-resizer v2.x
  # starts its VolumeAttributesClass informer unconditionally — without this
  # rule the reflector wedges in a forbidden list/watch retry loop (~190
  # errors/hr observed in production, 2026-08-19).
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattributesclasses"]
    verbs: ["get", "list", "watch"]
  # Snapshotter permissions
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots/status"]
    verbs: ["update", "patch"]
  # Resizer permissions
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["update", "patch"]
  # (C10) Leader-election leases moved to a namespace-scoped Role below: every
  # sidecar passes --leader-election-namespace=<release namespace>, so
  # cluster-scoped access here was unnecessary privilege, and "delete" is not
  # a verb client-go leader election ever needs.
  {{- if .Values.capacity.enabled }}
  # CSIStorageCapacity tracking (external-provisioner --enable-capacity). The
  # provisioner also resolves its ownerref (Deployment -> ReplicaSet -> Pod), so
  # it needs get on its own Pod and the ReplicaSet. Default off => rules absent.
  - apiGroups: ["storage.k8s.io"]
    resources: ["csistoragecapacities"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  {{- end }}
  {{- if .Values.sidecars.healthMonitor.enabled }}
  # External health monitor (csi-external-health-monitor-controller). It needs
  # get/list/watch on pods to map abnormal volumes to workloads; persistentvolumes
  # (get/list/watch) and nodes are already granted above. The provisioner's events
  # rule above omits `get`, which upstream's health-monitor RBAC grants, so it is
  # added here (gated) for canonical parity. Default off => rules absent =>
  # byte-identical render.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "scale-csi.fullname" . }}-controller
  labels:
    {{- include "scale-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "scale-csi.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "scale-csi.fullname" . }}-controller
  apiGroup: rbac.authorization.k8s.io
---
# (C10) Leader-election leases, namespaced. Every sidecar (provisioner,
# attacher, resizer, snapshotter) passes
# --leader-election-namespace={{ .Release.Namespace }}, so a cluster-scoped
# grant here was needless privilege, and "delete" is a verb client-go leader
# election never calls (it releases a lease by updating holderIdentity, not
# by deleting the object).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "scale-csi.fullname" . }}-controller-leases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scale-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "scale-csi.fullname" . }}-controller-leases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scale-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "scale-csi.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "scale-csi.fullname" . }}-controller-leases
  apiGroup: rbac.authorization.k8s.io
{{- end }}
