{{- if and .Values.serviceAccount.create .Values.controller.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "scale-csi.controllerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scale-csi.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.rbac.create .Values.controller.enabled }}
{{- if .Values.serviceAccount.create }}
---
{{- end }}
{{- /* (C10) Cluster-wide get on ALL Secrets is dead privilege unless a
RENDERED StorageClass actually names a controller-side CSI secret ref — every
bundled example that would need one ships disabled by default. This is mounted
into five upstream sidecar containers and is the one authorized to destroy
backend objects, so gate the rule instead of granting it unconditionally (note:
.kube-linter.yaml excludes access-to-secrets, so no linter catches this either).

The gate is DERIVED, not re-implemented. scale-csi.storageClassList is the same
helper templates/storageclass.yaml renders from, and
scale-csi.storageClassParameters builds the same parameter map it ships, so the
two cannot disagree about which classes exist or what they reference. The
hand-written copy that used to live here disagreed in both directions:

  - It ADDED the legacy singular .Values.storageClass to the plural count while
    storageclass.yaml REPLACES the list with it, so a displaced plural class
    carrying chapSecretName/encryptionSecretName still switched the rule on for
    a release whose rendered classes need nothing.

  - It only knew about chapSecretName/encryptionSecretName. A class that names
    csi.storage.k8s.io/provisioner-secret-name directly through extraParameters
    — a perfectly ordinary thing to do — rendered with NO secrets rule granted,
    and every PVC on it stayed Pending with only a Forbidden line in the
    external-provisioner log to say why.

encryption.enabled stays as a separate OR: pkg/driver/reconcile_encryption.go's
locked-volume reconciler reads a Secret named by LIVE StorageClass parameters
whenever d.config.Encryption.Enabled is set, entirely independent of chart
values (e.g. StorageClasses managed out-of-band via Flux/Kustomize). Without
it, that reconciler runs permanently Forbidden: encrypted volumes stay LOCKED
after a NAS reboot and pods see I/O errors indefinitely, logged and nowhere
else.

rbac.controllerSecretGet is the third OR, and it covers the one input a chart
CANNOT see: PersistentVolumes that were ALREADY provisioned. A PV's
spec.csi.{controllerPublish,controllerExpand,nodeStage,nodePublish}SecretRef is
stamped at provision time from the StorageClass parameters then in force, and it
outlives every later edit to that StorageClass. Both derivations above describe
volumes provisioned FROM NOW ON, so dropping a secret ref from a StorageClass
silently revokes a permission existing volumes still depend on — the rule
disappears on the next upgrade and external-attacher/-resizer start failing
closed for those PVs only, with AttachVolume.Attach stuck on a Forbidden secret
read (live: v1.11.1, 2026-09-17, 12 PVs, one of them retried 3233 times in 67
minutes). Set this when volumes predate a StorageClass secret-ref change; the
honest audit is `kubectl get pv -o json | jq '[.items[]|select(.spec.csi
.controllerPublishSecretRef)]|length'`. */}}
{{- $needsSecretGet := false -}}
{{- range $storageClass := (include "scale-csi.storageClassList" . | fromJsonArray) }}
{{- $parameters := include "scale-csi.storageClassParameters" (dict "root" $ "class" $storageClass) | fromJson }}
{{- if include "scale-csi.storageClassNeedsControllerSecretGet" $parameters }}
{{- $needsSecretGet = true -}}
{{- end }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "scale-csi.fullname" . }}-controller
  labels:
    {{- include "scale-csi.labels" . | nindent 4 }}
rules:
  # Provisioner permissions
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  {{- if or $needsSecretGet .Values.encryption.enabled .Values.rbac.controllerSecretGet }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- end }}
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments/status"]
    verbs: ["patch"]
  # VolumeAttributesClass (storage.k8s.io/v1). Unconditional, not sidecar-gated:
  # the driver implements ControllerModifyVolume (v1.9.0), and csi-resizer v2.x
  # starts its VolumeAttributesClass informer unconditionally — without this
  # rule the reflector wedges in a forbidden list/watch retry loop (~190
  # errors/hr observed in production, 2026-08-19).
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattributesclasses"]
    verbs: ["get", "list", "watch"]
  # Snapshotter permissions
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots/status"]
    verbs: ["update", "patch"]
  # Resizer permissions
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["update", "patch"]
  # (C10) Leader-election leases moved to a namespace-scoped Role below: every
  # sidecar passes --leader-election-namespace=<release namespace>, so
  # cluster-scoped access here was unnecessary privilege, and "delete" is not
  # a verb client-go leader election ever needs.
  {{- if .Values.capacity.enabled }}
  # CSIStorageCapacity tracking (external-provisioner --enable-capacity). The
  # provisioner also resolves its ownerref (Deployment -> ReplicaSet -> Pod), so
  # it needs get on its own Pod and the ReplicaSet. Default off => rules absent.
  - apiGroups: ["storage.k8s.io"]
    resources: ["csistoragecapacities"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  {{- end }}
  {{- if .Values.sidecars.healthMonitor.enabled }}
  # External health monitor (csi-external-health-monitor-controller). It needs
  # get/list/watch on pods to map abnormal volumes to workloads; persistentvolumes
  # (get/list/watch) and nodes are already granted above. The provisioner's events
  # rule above omits `get`, which upstream's health-monitor RBAC grants, so it is
  # added here (gated) for canonical parity. Default off => rules absent =>
  # byte-identical render.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "scale-csi.fullname" . }}-controller
  labels:
    {{- include "scale-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "scale-csi.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "scale-csi.fullname" . }}-controller
  apiGroup: rbac.authorization.k8s.io
---
# (C10) Leader-election leases, namespaced. Every sidecar (provisioner,
# attacher, resizer, snapshotter) passes
# --leader-election-namespace={{ .Release.Namespace }}, so a cluster-scoped
# grant here was needless privilege, and "delete" is a verb client-go leader
# election never calls (it releases a lease by updating holderIdentity, not
# by deleting the object).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "scale-csi.fullname" . }}-controller-leases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scale-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "scale-csi.fullname" . }}-controller-leases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scale-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "scale-csi.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "scale-csi.fullname" . }}-controller-leases
  apiGroup: rbac.authorization.k8s.io
{{- end }}
