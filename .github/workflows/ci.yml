# Scale CSI Driver - CI/CD Pipeline

name: CI

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Run go vet
        run: go vet ./...
      - name: Verify golangci-lint config
        # Fails fast (and cheaply) on a malformed .golangci.yml before the
        # much heavier full lint run below attempts to use it.
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 config verify
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2

      # The repo-specific analyzers encode bug classes that shipped as real
      # incidents and that no general linter catches (raw ZFS user-property
      # reads that ignore inheritance, unhardened host-tool execs, blkid
      # without -p, volume IDs as metric labels). They were written but never
      # wired into anything, so they enforced nothing while .golangci.yml cited
      # one of them as compensating coverage for a relaxed check.
      - name: Run repo-specific analyzers
        run: go run ./hack/lint/repolint ./pkg/... ./cmd/...

      # The analyzers' own tests. A rule that silently matches nothing reports
      # clean and is worse than no rule; RG-BLKID-NO-P was exactly that until
      # these fixtures existed.
      - name: Test repo-specific analyzers
        run: go test ./hack/lint/repolint/...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Run tests with coverage
        run: go test -v -race -short -coverprofile=coverage.out -covermode=atomic ./...
      - name: Run pkg/driver a second time with -shuffle=on
        # See the Makefile's `check` target comment: much of the backend-health
        # and metric state is process-global, so a leaking test can pass in
        # declaration order and fail only under a specific shuffle seed
        # (GF5/H1 shipped exactly that way). Kept as its own step so a
        # shuffle-only failure is easy to spot separately from the coverage run.
        run: go test -count=1 -shuffle=on ./pkg/driver/
      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          # Ratchet, not a fixed floor: measured coverage at the time this was
          # raised was 73.4% (go test -v -race -short -coverprofile ... ./...,
          # go tool cover -func). 70 leaves a ~3.4-point margin for normal
          # fluctuation without inviting the threshold to rot back down to a
          # number nobody re-measured.
          THRESHOLD=70
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
      - name: Generate coverage report
        run: go tool cover -func=coverage.out
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  csi-sanity:
    name: CSI Sanity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Run the official CSI conformance suite
        run: go test -v -race -count=1 -run '^TestCSISanity$' ./pkg/driver

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  codeql:
    name: CodeQL (Go)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: go
      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:go

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Build
        run: CGO_ENABLED=0 go build -o scale-csi ./cmd/scale-csi
      - name: Verify binary
        run: ./scale-csi --help

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Lint Helm chart
        run: helm lint --strict charts/scale-csi/
      - name: Run chart Go test suite
        # test/chart's ~80 test functions shell out to `helm template`/`helm
        # lint` themselves; they self-skip via exec.LookPath("helm") when helm
        # isn't on PATH, which is exactly what silently happened in the Unit
        # Tests job (no helm installed there) -- so this suite has been
        # exercised locally only until now. This job already has helm on
        # PATH, so run it for real here instead.
        run: go test -v -race -count=1 ./test/chart/...
      - name: Template every protocol and controller mode
        run: |
          helm template scale-csi charts/scale-csi/ \
            --set truenas.host=test.local \
            --set truenas.existingSecret=test-secret \
            --set zfs.parentDataset=tank/test \
            --set nfs.enabled=true \
            --set iscsi.enabled=false \
            --set nvmeof.enabled=false >/dev/null
          helm template scale-csi charts/scale-csi/ \
            --set truenas.host=test.local \
            --set truenas.existingSecret=test-secret \
            --set zfs.parentDataset=tank/test \
            --set nfs.enabled=false \
            --set iscsi.enabled=true \
            --set nvmeof.enabled=false >/dev/null
          helm template scale-csi charts/scale-csi/ \
            --set truenas.host=test.local \
            --set truenas.existingSecret=test-secret \
            --set zfs.parentDataset=tank/test \
            --set nfs.enabled=false \
            --set iscsi.enabled=false \
            --set nvmeof.enabled=true \
            --set nvmeof.subsystemAllowAnyHost=true >/dev/null
          helm template scale-csi charts/scale-csi/ \
            --set truenas.host=test.local \
            --set truenas.existingSecret=test-secret \
            --set zfs.parentDataset=tank/test \
            --set controller.replicas=2 \
            --set fencing.mode=off >/dev/null
          helm template scale-csi charts/scale-csi/ \
            --set truenas.host=test.local \
            --set truenas.existingSecret=test-secret \
            --set zfs.parentDataset=tank/test \
            --set controller.replicas=1 \
            --set fencing.mode=strict >/dev/null
          deprecated_render="$(helm template deprecated-iscsi-only charts/scale-csi/ \
            --show-only templates/storageclass.yaml \
            --set truenas.host=test.local \
            --set truenas.existingSecret=test-secret \
            --set zfs.parentDataset=tank/test \
            --set nfs.enabled=false \
            --set iscsi.enabled=true \
            --set nvmeof.enabled=false \
            --set storageClass.name=scale-iscsi)"
          if grep -Eq '^(mountOptions:|  protocol:)' <<<"${deprecated_render}"; then
            echo "deprecated iSCSI-only StorageClass unexpectedly emitted mountOptions or protocol"
            echo "${deprecated_render}"
            exit 1
          fi
      - name: Validate GF6 transport values and rendering
        run: |
          default_config="$(helm template gf6-default charts/scale-csi/ \
            --show-only templates/configmap.yaml \
            --set truenas.host=192.0.2.10 \
            --set truenas.existingSecret=test-secret \
            --set zfs.parentDataset=pool/test)"
          if grep -Eq '^      (nconnect|trunking|multipath|portals|addresses):' <<<"${default_config}"; then
            echo "default ConfigMap unexpectedly rendered a GF6 opt-in key"
            echo "${default_config}"
            exit 1
          fi

          enabled_config="$(helm template gf6-enabled charts/scale-csi/ \
            --show-only templates/configmap.yaml \
            --set truenas.host=192.0.2.10 \
            --set truenas.existingSecret=test-secret \
            --set zfs.parentDataset=pool/test \
            --set nfs.server=192.0.2.20 \
            --set nfs.nconnect=8 \
            --set nfs.trunking=true \
            --set 'nfs.addresses[0]=192.0.2.21' \
            --set iscsi.portal=192.0.2.30 \
            --set iscsi.multipath=true \
            --set 'iscsi.portals[0]=192.0.2.31')"
          grep -q '^      nconnect: 8$' <<<"${enabled_config}"
          grep -q '^      trunking: true$' <<<"${enabled_config}"
          grep -q '^      multipath: true$' <<<"${enabled_config}"
          grep -q '192.0.2.21' <<<"${enabled_config}"
          grep -q '192.0.2.31' <<<"${enabled_config}"

          if helm template gf6-invalid-nconnect charts/scale-csi/ \
            --set truenas.host=192.0.2.10 \
            --set truenas.existingSecret=test-secret \
            --set zfs.parentDataset=pool/test \
            --set nfs.nconnect=17 >/dev/null 2>&1; then
            echo "nfs.nconnect=17 unexpectedly passed chart validation"
            exit 1
          fi
          if helm template gf6-invalid-iscsi charts/scale-csi/ \
            --set truenas.host=192.0.2.10 \
            --set truenas.existingSecret=test-secret \
            --set zfs.parentDataset=pool/test \
            --set iscsi.multipath=true >/dev/null 2>&1; then
            echo "iscsi.multipath=true unexpectedly accepted an empty portal list"
            exit 1
          fi
      - name: Validate Kubernetes manifests
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1
        with:
          directory: charts/scale-csi/
          config: .kube-linter.yaml

  fuzz-smoke:
    name: Fuzz Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Run every Fuzz target for 30s
        # Discovers targets by name instead of hardcoding the list: another
        # branch is actively adding fuzz targets, and this must keep exercising
        # whatever exists rather than a snapshot taken today. `go test -fuzz`
        # only accepts one target per invocation, so this loops per package.
        run: |
          set -euo pipefail
          status=0
          discovered=0
          for pkg in $(go list ./...); do
            # Do NOT swallow the -list failure. Discarding stderr and forcing
            # true meant a package whose tests stopped compiling yielded zero
            # targets and a GREEN job -- a fuzz gate that fuzzes nothing and
            # reports success, while gating the container build.
            if ! listing=$(go test -list '^Fuzz' "$pkg" 2>&1); then
              echo "::error::cannot list fuzz targets in $pkg (does it compile?)"
              echo "$listing"
              status=1
              continue
            fi
            targets=$(printf '%s\n' "$listing" | grep '^Fuzz' || true)
            for target in $targets; do
              echo "::group::${pkg} ${target}"
              if ! go test -run '^$' -fuzz "^${target}\$" -fuzztime=30s "$pkg"; then
                status=1
              fi
              discovered=$((discovered + 1))
              echo "::endgroup::"
            done
          done
          # A repo with fuzz targets that discovers none has a broken harness,
          # not a clean run.
          if [ "$discovered" -eq 0 ]; then
            echo "::error::no fuzz targets were discovered; the harness is broken"
            status=1
          fi
          echo "fuzzed $discovered target(s)"
          exit "$status"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # Installed from a checksum-verified release tarball rather than the
        # gitleaks-action wrapper, which gates some of its features behind a
        # license; the OSS gitleaks CLI itself needs none of that.
        run: |
          set -euo pipefail
          cd /tmp
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        # Full git history, redacted output. .gitleaks-baseline.json pins the
        # exact fingerprints of findings already reviewed and confirmed to be
        # test fixtures / doc examples (see that file) -- anything else, in
        # any commit, still fails the scan.
        run: gitleaks detect --source . --no-banner --redact --baseline-path .gitleaks-baseline.json

  docker-build:
    name: Container Build
    runs-on: ubuntu-latest
    needs: [lint, test, csi-sanity, govulncheck, build, helm-lint, fuzz-smoke, secret-scan]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build-image.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Build and push Docker image
        id: build-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            # Busts the `apk upgrade` layer's cache every build; see Dockerfile.
            APK_REFRESH=${{ github.run_id }}

  sign-image:
    name: Sign Release Image
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # Sign only after the Trivy gate passes so a scan-rejected image is never
    # left signed. docker-build is implied through trivy but kept explicit.
    needs: [docker-build, trivy]
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless-sign the pushed manifest
        env:
          IMAGE: ${{ needs.docker-build.outputs.image }}
          DIGEST: ${{ needs.docker-build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  trivy:
    name: Trivy Release Image
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan the pushed manifest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.docker-build.outputs.image }}@${{ needs.docker-build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: .trivyignore
          timeout: 15m

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    # trivy is satisfied transitively through sign-image.
    needs: [sign-image]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
