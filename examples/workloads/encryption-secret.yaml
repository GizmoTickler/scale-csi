# Passphrase Secret for an encrypted StorageClass
# (examples/helm/values-encryption.yaml, class "scale-nfs-encrypted").
#
# Generate a strong passphrase and keep an offline copy: losing this Secret
# makes every volume of the class permanently unreadable.
#
#   kubectl -n scale-csi create secret generic scale-nfs-encrypted \
#     --from-literal=passphrase="$(openssl rand -base64 32)"
#
# or edit and apply this file. Optional keys are described in
# docs/reference/storageclass.md#the-encryption-secret.
apiVersion: v1
kind: Secret
metadata:
  name: scale-nfs-encrypted
  namespace: scale-csi
type: Opaque
stringData:
  # Required. At least 8 characters (the ZFS minimum).
  passphrase: "REPLACE-WITH-A-LONG-RANDOM-PASSPHRASE"
